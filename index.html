<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Chimpokomon: a two-player co-op roguelike creature battler.">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Chimpokomon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Cinzel+Decorative:wght@700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: night-stadium broadcast. Scoreboard header, turf battlefield, side rail of action panels. Single dark theme by choice. */
:root{
  --bg:#140f0c; --bg2:#1d1611; --panel:#241b15; --panel2:#30241b; --line:#4d3b2a;
  --fg:#f5ecdb; --muted:#bba98c; --flood:#e9b949; --flood-ink:#2a1a04;
  --gold:#e9b949; --gold-hi:#f8dc8a; --stone:#d9cbb2; --royal:#2c4fb8; --royal-d:#1b3070; --velvet:#8e1f2a; --purple:#6a2fa8;
  --p1:#ff6f5e; --p2:#4fb8ff; --foe:#d9a6ff;
  --good:#5fd068; --warn:#ffd23f; --bad:#ff5a4f;
  --f-display:'Cinzel','Trajan Pro','Times New Roman',serif;
  --f-logo:'Cinzel Decorative','Cinzel','Times New Roman',serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{background:radial-gradient(ellipse 120% 60% at 50% -10%,#3a2a1d,transparent 60%),radial-gradient(ellipse 80% 50% at 50% 120%,#24140f,transparent 70%),var(--bg);background-attachment:fixed}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 14px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent) 1;margin-bottom:18px}
.brand{font-family:var(--f-logo);font-weight:900;font-size:22px;letter-spacing:.04em;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#a87420);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--f-label);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg2)}
.pill.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.pill.off{color:var(--bad)}
h1,h2,h3{text-wrap:balance;margin:0}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:15px;background:linear-gradient(180deg,#3d2f24,#2a2019);border:1px solid #6b5238;border-radius:7px;padding:10px 14px;cursor:pointer;transition:transform .08s,filter .15s;box-shadow:inset 0 1px 0 rgba(255,230,180,.12),0 2px 0 rgba(0,0,0,.35)}
.btn:hover:not(:disabled){filter:brightness(1.18)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#b98325);color:var(--flood-ink);border-color:#f8dc8a;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #6a4510,0 0 18px rgba(233,185,73,.25)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.p0{border-color:var(--p1)} .btn.p1{border-color:var(--p2)}
:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
input[type=text]{font:inherit;font-size:16px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);width:100%;min-width:0}
.c0{color:var(--p1)} .c1{color:var(--p2)}
.ty{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--tc)}
.tys{display:inline-flex;gap:4px;flex-wrap:wrap}
.st{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:11px;padding:1px 5px;border-radius:3px;color:#120e0a;letter-spacing:.05em}
.st.brn{background:#ff8a4a}.st.par{background:#f5cc2a}.st.psn{background:#c27ae0}.st.slp{background:#b8b8c8}.st.frz{background:#8ad8e0}

/* Lobby */
.hero{position:relative;padding:28px 0 8px;display:grid;gap:18px}
.hero h1{font-family:var(--f-display);font-size:clamp(40px,9vw,92px);line-height:.95;letter-spacing:.01em;text-shadow:4px 4px 0 var(--p1),-4px -4px 0 var(--p2)}
.hero p{max-width:60ch;color:var(--muted);font-size:17px;margin:0}
.lineup{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.lineup .mon{width:clamp(80px,16vw,130px);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;display:flex;gap:8px;align-items:center;background:var(--bg2)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--flood);color:var(--flood-ink);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.card{background:linear-gradient(180deg,#2c2219,#1f1712);border:1px solid var(--line);border-top:2px solid rgba(233,185,73,.55);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0;box-shadow:inset 0 0 0 1px rgba(233,185,73,.08),0 10px 30px rgba(0,0,0,.35)}
.card h3{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--stone)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:600}
.code{font-family:var(--f-display);font-size:clamp(40px,10vw,72px);letter-spacing:.12em;color:var(--flood)}

/* Starter select */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sc{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;justify-items:center;text-align:center;cursor:pointer;min-width:0}
.sc .mon{width:96px;height:96px}
.sc .nm{font-family:var(--f-label);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.sc.sel0{border-color:var(--p1);box-shadow:0 0 0 3px color-mix(in srgb,var(--p1) 30%,transparent)}
.sc.sel1{border-color:var(--p2);box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 30%,transparent)}
.sc:disabled{cursor:not-allowed;opacity:.4}
.sbars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;width:100%;font-family:var(--f-label);font-size:11px;color:var(--muted);align-items:center;text-align:left}
.sbar{height:5px;border-radius:3px;background:#3a2c20;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--flood)}

/* Generic layouts */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph h3{font-family:var(--f-label);font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.bigtitle{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,7vw,60px);line-height:1;letter-spacing:.02em;color:var(--stone);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.party{display:grid;gap:6px}
.pc{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left;width:100%}
.pc:hover{border-color:#7a5c3a}
.pc .mon{width:52px;height:52px}
.pc .nm{font-family:var(--f-label);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.pc.down{opacity:.5}
.pc .lv{font-family:var(--f-label);color:var(--muted);font-variant-numeric:tabular-nums}
.bag{display:flex;gap:6px;flex-wrap:wrap}
.bag span{font-family:var(--f-label);font-size:13px;letter-spacing:.04em;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.bracket{display:grid;gap:6px}
.match{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.match.cur{border-color:var(--flood)}
.match .r{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;font-size:13px}
.match .o{font-weight:600;min-width:0}
.res{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.res.w{color:var(--good)} .res.n{color:var(--flood)}
.readyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.hpbar{height:7px;border-radius:4px;background:#0a120f;overflow:hidden;border:1px solid #000}
.hpfill{height:100%;width:var(--to);background:var(--hc);animation:hpd .55s ease-out}
@keyframes hpd{from{width:var(--from)}}
.hpnum{font-family:var(--f-label);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Battle */
.battle{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:900px){.battle{grid-template-columns:minmax(0,1fr)}}
.field{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);padding:14px;display:grid;gap:4px;
  background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(255,236,170,.28),transparent 70%),repeating-linear-gradient(90deg,#3b2f22 0 56px,#33281d 56px 112px)}
.field.wild{background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(200,255,200,.16),transparent 70%),repeating-linear-gradient(100deg,var(--ac) 0 40px,color-mix(in srgb,var(--ac) 82%,#000) 40px 80px)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow.foes{padding-left:14%}
.frow.allies{padding-right:14%}
@media (max-width:560px){.frow.foes{padding-left:0}.frow.allies{padding-right:0}.field{padding:10px}.plate .l1{flex-wrap:wrap}.plate .nm{white-space:normal;overflow-wrap:anywhere;font-size:15px}}
.spot{display:grid;justify-items:center;gap:4px;min-width:0}
.spot .sprite{width:clamp(76px,17vw,138px);aspect-ratio:1;max-width:100%;position:relative}
.spot .sprite svg{width:100%;height:100%;display:block}
.spot .shadow{width:70%;height:10px;border-radius:50%;background:rgba(0,0,0,.35);margin-top:-14px}
.spot.empty .sprite{opacity:.0}
.plate{width:100%;max-width:220px;background:rgba(20,14,10,.86);border-radius:8px;padding:6px 8px;border-left:4px solid var(--oc);display:grid;gap:3px;min-width:0}
.plate .l1{display:flex;justify-content:space-between;gap:6px;align-items:baseline;min-width:0}
.plate .nm{font-family:var(--f-label);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .lv{font-family:var(--f-label);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.plate .own{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--oc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ally .sprite svg{transform:scaleX(-1)}
.hit .sprite{animation:hit .45s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-8px);filter:brightness(2.2)}40%{transform:translateX(7px)}60%{transform:translateX(-4px);filter:brightness(1.8)}}
.faint .sprite{animation:faint .7s forwards}
@keyframes faint{to{transform:translateY(30%) scale(.6);opacity:0}}
.in .sprite{animation:pop .45s}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.heal .sprite{animation:glow .6s}
@keyframes glow{50%{filter:brightness(1.4) drop-shadow(0 0 12px #9effa0)}}
.up .sprite{animation:up .5s}
@keyframes up{50%{transform:translateY(-8px)}}
.down .sprite{animation:dn .5s}
@keyframes dn{50%{transform:translateY(6px);filter:saturate(.3)}}
.ball .sprite{animation:wob .55s}
@keyframes wob{25%{transform:rotate(-12deg) scale(.7)}75%{transform:rotate(12deg) scale(.7)}}
.caught .sprite{animation:faint .9s forwards}
.logbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:76px;display:grid;gap:8px}
.logline{font-size:17px;font-weight:600}
.loghist{font-size:13px;color:var(--muted);max-height:110px;overflow:auto;display:grid;gap:2px}
.rail{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;border-top:4px solid var(--oc)}
.panel .who{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--oc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv{display:grid;gap:3px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.mv:hover:not(:disabled){background:#3a2c20}
.mv:disabled{opacity:.4;cursor:not-allowed}
.mv .n{font-family:var(--f-label);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .d{font-family:var(--f-label);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ef{font-family:var(--f-label);font-weight:700;font-size:11px;border-radius:3px;padding:0 4px}
.ef.s{background:var(--good);color:#0d1a08}.ef.w{background:#5a6a62;color:#e8efe9}.ef.z{background:var(--bad);color:#200806}
.opt{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px 4px 4px;cursor:pointer;text-align:left;width:100%}
.opt .mon{width:44px;height:44px}
.opt:disabled{opacity:.4;cursor:not-allowed}
.wait{font-family:var(--f-label);letter-spacing:.04em;color:var(--muted);font-size:16px}

.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.pips i.on{background:var(--flood);border-color:var(--flood)}
.offers{display:grid;gap:8px}
.oc{display:grid;gap:6px;text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.oc:hover:not(:disabled){border-color:#8a6a44}
.oc:disabled{cursor:default}
.oc:disabled:not(.sel0):not(.sel1){opacity:.45}
.oc.sel0{border-color:var(--p1)} .oc.sel1{border-color:var(--p2)}
.oc .nm{font-family:var(--f-label);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.oc-m{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.oc-m .mon{width:56px;height:56px}
.match.boss .r{color:var(--foe)}
.evo-opt{grid-template-columns:44px 1fr 44px}
.field.ff{background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(217,166,255,.30),transparent 70%),repeating-linear-gradient(90deg,#2a1838 0 56px,#24142f 56px 112px)}
img.mon{object-fit:contain;display:block}
@keyframes evoout{0%{filter:none}55%{filter:brightness(3.5) saturate(0)}100%{filter:brightness(4) saturate(0);opacity:.25;transform:scale(.85)}}
@keyframes evoin{0%{opacity:0;transform:scale(.3);filter:brightness(4)}100%{opacity:1;transform:none;filter:none}}
.stage3d{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9.5;background:#0a0f0d;min-height:300px}
@media (max-width:700px){.stage3d{aspect-ratio:auto;height:min(118vw,520px)}}
.stage-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px;z-index:2}
.hrow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hud .plate{max-width:min(46%,220px);backdrop-filter:blur(2px)}
.hud .plate.ghost{visibility:hidden}
.hud .plate.ko{opacity:.45}
.vs{position:absolute;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;gap:10px;background:radial-gradient(ellipse at center,rgba(12,8,5,.55),rgba(12,8,5,.85));text-align:center;padding:16px;animation:vsfade 2.3s both}
@keyframes vsfade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.vs-lab{font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--flood);font-weight:700;animation:slam .6s .1s both}
.vs-title{font-family:var(--f-display);font-size:clamp(22px,5vw,40px);color:var(--foe);animation:slam .7s .25s both}
.vs-row{display:flex;align-items:center;gap:clamp(10px,3vw,30px)}
.vs-side{display:grid;gap:2px;font-family:var(--f-label);font-size:clamp(16px,3.2vw,26px);text-transform:uppercase;letter-spacing:.04em}
.vs-side.l{animation:inl .6s .35s cubic-bezier(.2,1.4,.4,1) both;text-align:right}
.vs-side.r{animation:inr .6s .35s cubic-bezier(.2,1.4,.4,1) both;text-align:left}
.vs-x{font-family:var(--f-display);font-size:clamp(36px,8vw,72px);color:var(--flood);text-shadow:3px 3px 0 var(--p1),-3px -3px 0 var(--p2);animation:slam .5s .6s cubic-bezier(.2,1.6,.4,1) both}
.vs-venue{font-family:var(--f-label);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;animation:slam .5s .9s both}
.vs-boss .vs-x,.vs-ff .vs-x{color:var(--foe)}
@keyframes inl{from{opacity:0;transform:translateX(-80px)}}
@keyframes inr{from{opacity:0;transform:translateX(80px)}}
@keyframes slam{0%{opacity:0;transform:scale(2.2)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:none}}
[data-slam]{animation:slam .7s cubic-bezier(.2,1.5,.4,1) both}
[data-rv]{animation:rvin .8s cubic-bezier(.2,1.3,.35,1) both;position:relative}
@keyframes rvin{0%{opacity:0;transform:perspective(700px) translateY(34px) rotateX(75deg) scale(.82);filter:brightness(3)}55%{opacity:1;filter:brightness(1.8)}100%{opacity:1;transform:none;filter:none}}
.dramahead{display:grid;gap:4px;margin:4px 0 16px}
.titlecard{border-radius:16px;padding:22px;margin-bottom:16px;display:grid;gap:8px;justify-items:start;border:1px solid var(--line);background:linear-gradient(120deg,#2a1438,#1d1611 70%);box-shadow:inset 0 0 0 1px rgba(217,166,255,.25)}
.titlecard.boss{background:linear-gradient(120deg,#3a2408,#1d1611 70%);box-shadow:inset 0 0 0 1px rgba(255,210,63,.3)}
.titlecard h2{font-family:var(--f-display);font-size:clamp(28px,6vw,52px);line-height:1;color:var(--foe)}
.titlecard.boss h2{color:var(--flood)}
.titlecard p{margin:0;font-family:var(--f-label);font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.tc-venue{font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:13px}
.rar{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor;justify-self:center}
.r-C{color:#b8c4be}.r-U{color:#5fd068}.r-R{color:#6aa8ff}.r-L{color:#ffd23f;background:rgba(255,210,63,.12)}
.rdot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.sc.leg{border-color:#ffd23f;background:linear-gradient(160deg,#3a2e08,var(--bg2) 55%);box-shadow:0 0 0 2px rgba(255,210,63,.35),0 0 26px rgba(255,210,63,.25)}
.sc.leg .nm{color:#ffd23f}
.rar.sm{font-size:10px;padding:0 6px;letter-spacing:.08em}

.oc.oc-L .nm{color:#ffd23f}

/* ---- Battle HUD ---- */
.bwrap{position:relative}
.arena{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;min-height:300px}
.arena.stage3d{aspect-ratio:16/10}
.arena.field2d{background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(255,236,170,.28),transparent 70%),repeating-linear-gradient(90deg,#3b2f22 0 56px,#33281d 56px 112px);display:grid;align-content:start;gap:0;padding:140px 14px 14px}
.arena.field2d .spot .sprite{width:clamp(70px,9vw,110px)}
.arena.field2d .frow.allies{margin-top:-20px}
.arena.field2d.ff{background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(217,166,255,.30),transparent 70%),repeating-linear-gradient(90deg,#2a1838 0 56px,#24142f 56px 112px)}
.hud2{position:absolute;inset:0;z-index:2;pointer-events:none}
.hud2 [data-do]{pointer-events:auto;cursor:pointer}
.hud-tl,.hud-tr{position:absolute;top:10px;width:min(290px,31%);display:grid;gap:6px}
.hud-tl{left:10px}.hud-tr{right:10px}
.hpnl{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;align-items:center;background:rgba(20,14,10,.84);border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--oc);border-radius:10px;padding:6px 8px;backdrop-filter:blur(3px)}
.hpnl.ghost{visibility:hidden}
.hpnl.ko{opacity:.5}
.hpnl.foc{box-shadow:0 0 0 2px var(--foe)}
.hp-por{width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden}
.hp-por .mon{width:100%;height:100%}
.hp-main{display:grid;gap:3px;min-width:0}
.hp-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hp-top .own{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--oc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdots{display:inline-flex;gap:3px;flex:none}
.td{width:7px;height:7px;border-radius:50%;background:var(--good);display:block}
.td.ko{background:#4a524e}.td.st{background:var(--warn)}.td.e{background:transparent;border:1px solid #3a4440}
.hp-name{display:flex;gap:6px;align-items:center;min-width:0}
.hp-name b{font-family:var(--f-label);font-size:17px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-bar{position:relative;height:16px;border-radius:5px;background:#050908;border:1px solid #000;overflow:hidden}
.hp-bar .hpfill{position:absolute;left:0;top:0;bottom:0}
.hp-txt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.hp-foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hp-foot .ty{font-size:10px;padding:0 5px}
.spe{font-family:var(--f-label);font-weight:700;font-size:13px;color:var(--flood);font-variant-numeric:tabular-nums;white-space:nowrap}
.hp-stg{display:flex;gap:4px;flex-wrap:wrap}
.hp-stg span{font-family:var(--f-label);font-weight:700;font-size:11px;padding:0 5px;border-radius:3px}
.hp-stg .up{background:rgba(95,208,104,.2);color:#8ff09a}.hp-stg .dn{background:rgba(255,90,79,.2);color:#ff9a90}
.hud-tc{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;width:min(36%,420px)}
.turnb{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:#fff4d8;background:linear-gradient(180deg,var(--royal),var(--royal-d));border:1px solid var(--gold);border-top:0;padding:4px 22px 12px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);text-shadow:0 1px 0 #000}
.caption{background:rgba(20,14,10,.9);border:1px solid rgba(255,210,63,.4);border-radius:8px;padding:8px 12px;font-weight:600;font-size:15px;text-align:center}
.sorder{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;background:rgba(20,14,10,.8);border-radius:999px;padding:3px 8px}
.so-it{display:inline-flex;align-items:center;gap:3px;border-bottom:2px solid var(--oc);padding:0 2px}
.so-it .mon{width:24px;height:24px}
.so-it b{font-family:var(--f-label);font-size:12px;font-variant-numeric:tabular-nums}
.so-sep{color:var(--muted);font-weight:700}
.hud-l,.hud-r{position:absolute;top:224px}
.hud-l{left:10px}.hud-r{right:10px}
.statcol{display:grid;gap:2px;background:rgba(20,14,10,.8);border-radius:8px;padding:6px 8px;border-top:3px solid var(--oc);min-width:112px}
.sc-h{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--oc);margin-bottom:2px}
.sc-r{display:grid;grid-template-columns:30px 1fr 24px;gap:6px;font-family:var(--f-label);font-size:12px;font-variant-numeric:tabular-nums;align-items:center}
.sc-r span{color:var(--muted);letter-spacing:.06em}.sc-r b{text-align:right}.sc-r em{font-style:normal;text-align:right;color:var(--muted)}
.sc-r.up em,.sc-r.up span{color:#8ff09a}.sc-r.dn em,.sc-r.dn span{color:#ff9a90}
.dock{position:absolute;left:10px;bottom:10px;width:min(600px,56%);z-index:4;background:rgba(20,14,10,.9);border:1px solid rgba(255,255,255,.08);border-top:3px solid var(--oc);border-radius:12px;padding:8px 10px 10px;display:grid;gap:8px;backdrop-filter:blur(4px)}
.dock-b{display:grid;gap:8px}
.dock-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dtab{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.dtab.on{color:var(--oc);border-color:var(--oc)}
button.dtab{cursor:pointer}
.dtab i{font-style:normal;font-size:10px;border-radius:999px;padding:0 6px}
.dtab i.need{background:var(--flood);color:var(--flood-ink)}.dtab i.ok{background:#3a2e24;color:var(--muted)}
.dock-partner{margin-left:auto;font-family:var(--f-label);font-size:13px;color:var(--oc);letter-spacing:.04em}
.mvgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mvb{display:grid;gap:3px;text-align:left;border:1px solid rgba(255,255,255,.08);border-left:6px solid var(--tc);border-radius:9px;padding:6px 9px;cursor:pointer;min-width:0;background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 26%,#18110d),#18110d 75%)}
.mvb:hover:not(:disabled){filter:brightness(1.18)}
.mvb:disabled{opacity:.4;cursor:not-allowed}
.mvb-h{display:flex;justify-content:space-between;gap:6px;align-items:center}
.mvb-h .n{font-family:var(--f-label);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvb-s{display:flex;gap:7px;align-items:center;font-family:var(--f-label);font-size:13px;font-variant-numeric:tabular-nums}
.mvb-s .ty{font-size:10px;padding:0 5px}
.mvb-s .pp{margin-left:auto;font-weight:700}.mvb-s .pp.low{color:var(--bad)}
.mvb-s .pri{color:var(--flood);font-weight:700}
.pjs{display:flex;gap:4px;flex-wrap:wrap}
.pj{font-family:var(--f-label);font-size:12px;background:rgba(255,255,255,.07);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums;color:#dfe8e3}
.pj i{font-style:normal;color:var(--muted);margin-right:2px}
.pj.ko{background:rgba(255,210,63,.22);color:#ffe27a;font-weight:700}
.pj.ko2{background:rgba(255,210,63,.1);color:#ffe9a8}
.pj.ally{background:rgba(255,122,89,.18);color:#ffb39f}
.pj.z{opacity:.6}
.pj em{font-style:normal;font-weight:700}.pj .se{color:#8ff09a}.pj .nve{color:#c8d0d8}
.dock-act .btn{padding:6px 14px;font-size:13px}
.pgrid{grid-template-columns:1fr 1fr}
.blog{position:absolute;right:10px;bottom:10px;width:min(330px,30%);z-index:3;background:rgba(20,14,10,.88);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;backdrop-filter:blur(3px)}
.blog-h{display:flex;justify-content:space-between;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 10px;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer;color:var(--fg)}
.blog.closed .blog-h{border-bottom:0}
.blog-b{max-height:190px;overflow:auto;padding:6px 10px;display:grid;gap:3px;font-size:13px}
.blog-b .c0{color:#ffb39f}.blog-b .c1{color:#8fe6dc}.blog-b .fo{color:#e2c4ff}
@media (max-width:1100px){.hud-l,.hud-r{display:none}}
@media (max-width:900px){
  .dock,.blog{position:static;width:auto;margin-top:10px}
  .arena,.arena.stage3d{aspect-ratio:auto;height:min(120vw,540px)}
  .hud-tl,.hud-tr{width:calc(50% - 15px)}
  .hud-tc{top:auto;bottom:10px;width:calc(100% - 20px)}
  .hpnl{grid-template-columns:30px minmax(0,1fr);gap:6px;padding:5px 6px}
  .hp-por{width:30px;height:30px}
  .hp-name b{font-size:14px}
  .hp-foot .tys{display:none}
  .arena.field2d{padding-top:150px}
}
@media (max-width:520px){.mvgrid,.pgrid{grid-template-columns:1fr}.turnb{font-size:14px;padding:2px 12px}}

/* ---- Colosseum title screen ---- */
.title3d{position:relative;height:min(68vh,620px);min-height:380px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(233,185,73,.25),0 18px 50px rgba(0,0,0,.5);background:radial-gradient(ellipse 80% 60% at 50% 0%,#f0dfbf,#c9b48e 45%,#6a5640)}
.title3d.flat{display:grid;place-items:end center;padding-bottom:70px}
.title3d.flat .lineup{position:relative;z-index:1;justify-content:center}
.title3d .stage-canvas{z-index:0}
.title3d::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(20,14,10,.55),transparent 34%,transparent 70%,rgba(20,14,10,.75))}
.title-ov{position:absolute;left:0;right:0;top:20px;z-index:2;display:grid;justify-items:center;text-align:center;gap:6px;padding-inline:16px;pointer-events:none}
.title-kicker{font-family:var(--f-label);font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold-hi);text-shadow:0 1px 2px #000}
.logo{font-family:var(--f-logo);font-weight:900;font-size:clamp(38px,8.5vw,92px);line-height:.95;letter-spacing:.03em;margin:0;background:linear-gradient(180deg,#fff6d6,var(--gold-hi) 30%,var(--gold) 60%,#9a6618);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2208) drop-shadow(0 8px 18px rgba(0,0,0,.6));animation:logoin 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes logoin{from{opacity:0;transform:scale(1.6);filter:blur(6px)}}
.title-tag{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(14px,2vw,19px);color:#fff4d8;text-shadow:0 2px 4px #000}
.title-feat{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;display:flex;gap:8px;align-items:center;white-space:nowrap;font-family:var(--f-label);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);background:rgba(20,14,10,.7);border:1px solid rgba(233,185,73,.4);border-radius:999px;padding:5px 14px}
.title-feat b{color:var(--gold-hi)}
.steps{margin:18px 0 0}
.steps li{background:linear-gradient(180deg,#2c2219,#1f1712);border-color:var(--line)}
.steps li::before{background:linear-gradient(180deg,var(--gold-hi),var(--gold));}
.hpnl,.dock,.blog,.statcol{border-color:rgba(233,185,73,.18)}
.dock{box-shadow:inset 0 0 0 1px rgba(233,185,73,.08),0 10px 30px rgba(0,0,0,.45)}
.titlecard{background:linear-gradient(120deg,#2a1438,#1d1611 70%)}
.titlecard.boss{background:linear-gradient(120deg,#3a2408,#1d1611 70%)}
.match{background:linear-gradient(180deg,#2a2019,#1f1813)}
.match.cur{border-color:var(--gold);box-shadow:0 0 0 1px rgba(233,185,73,.25)}
input[type=text]{background:#160f0b;border-color:#5a4632}
input[type=text]:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(233,185,73,.2)}
.label{color:#c9b28a}
.logbox,.panel{background:linear-gradient(180deg,#2c2219,#1f1712)}
/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(10,6,3,.76);display:grid;place-items:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:12px;border-top:5px solid var(--oc,var(--flood))}
.sumhead{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.sumhead .mon{width:120px;height:120px}
.statg{display:grid;grid-template-columns:42px 34px 1fr;gap:4px 8px;align-items:center;font-family:var(--f-label);font-size:14px;font-variant-numeric:tabular-nums}
.mvtable{width:100%;border-collapse:collapse;font-size:14px}
.mvtable td,.mvtable th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.mvtable th{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#160f0b;border:1px solid var(--flood);color:var(--fg);padding:12px 18px;border-radius:10px;z-index:25;font-weight:600;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:14px;align-items:center}
.evo{text-align:center;justify-items:center}
.evo .pair{display:flex;align-items:center;gap:14px;justify-content:center}
.evo .mon{width:120px;height:120px}
.evo .pair .mon:first-child{animation:evoout 2.2s ease-in both}.evo .pair .mon:last-child{animation:evoin .9s 1.3s cubic-bezier(.2,1.5,.4,1) both}
.areahead{border-radius:16px;padding:22px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 80%,#000),var(--panel));display:grid;gap:10px}
.wildlist{display:flex;gap:10px;flex-wrap:wrap}
.wildlist figure{margin:0;display:grid;justify-items:center;font-family:var(--f-label);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.wildlist svg{width:64px;height:64px}
.catchst{display:flex;gap:10px;flex-wrap:wrap}
.catchst span{font-family:var(--f-label);font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* relics */
.rels{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.relchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 10px 2px 6px;background:rgba(0,0,0,.25);cursor:pointer;line-height:1.4}
.relchip .ri{font-size:15px}.relchip.sm{padding:1px 5px}
.relbig{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;font-size:30px;border:2px solid currentColor;background:rgba(0,0,0,.3);flex:none}
.hp-rel{font-size:12px;letter-spacing:1px;white-space:nowrap}
/* progress track */
.ptrack{display:grid;gap:6px;justify-items:center;background:linear-gradient(180deg,#2c2219,#1f1712);border:1px solid rgba(233,185,73,.35);border-radius:12px;padding:10px 14px;margin:0 0 16px}
.pt-h{font-family:var(--f-label);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#e8dcc4}.pt-h b{color:var(--gold)}
.pt-cups{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pt-cups span.done{color:#8fd68f}.pt-cups span.cur{color:var(--gold);font-weight:700}.pt-cups em{font-style:normal;opacity:.5}
.pt-row{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap}
.pt-n{display:grid;justify-items:center;gap:3px}
.pt-n i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-style:normal;font-family:var(--f-label);font-weight:700;font-size:15px;border:2px solid #6a5a44;color:#b8a888;background:#1a130e}
.pt-n b{font-family:var(--f-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pt-n.boss i{border-radius:8px;transform:rotate(45deg)}.pt-n.boss i{font-size:14px}
.pt-n.done i{background:#2f6a3a;border-color:#8fd68f;color:#eaffea}
.pt-n.cur i{background:var(--gold);border-color:#fff2c0;color:#2a1a08;box-shadow:0 0 0 4px rgba(233,185,73,.25),0 0 18px rgba(233,185,73,.55);animation:ptpulse 1.6s ease-in-out infinite}
.pt-n.cur b{color:var(--gold)}
.pt-l{width:clamp(14px,4vw,46px);height:3px;background:#5a4a36;margin:0 4px 14px}
.ptrack.cmp{background:rgba(20,14,10,.84);padding:5px 10px;gap:4px;margin:0;border-radius:10px}.ptrack.cmp .pt-h{font-size:11px}.ptrack.cmp .pt-n i{width:20px;height:20px;font-size:11px;border-width:2px}.ptrack.cmp .pt-l{margin:0 3px;width:12px}
@keyframes ptpulse{50%{box-shadow:0 0 0 7px rgba(233,185,73,.08),0 0 26px rgba(233,185,73,.7)}}
/* lead picker + scouting */
.pc.lp.lead{border-color:var(--gold);box-shadow:0 0 0 2px rgba(233,185,73,.35);background:linear-gradient(100deg,#3a2c14,var(--bg2) 60%)}
.lead-tag{font-family:var(--f-label);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#2a1a08;border-radius:4px;padding:1px 6px}
.mh{font-family:var(--f-label);font-size:11px;letter-spacing:.03em;border-radius:4px;padding:1px 6px;white-space:nowrap}.mh.good{background:rgba(95,208,104,.18);color:#8fe89a}.mh.bad{background:rgba(255,106,90,.18);color:#ffaa9f}
.scout .scout-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.scout-t{display:grid;gap:6px;align-content:start}.scout-n{font-family:var(--f-label);font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--foe)}
.scout-m{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px 4px 4px}
.scout-m .mon{width:40px;height:40px}.scout-m .nm{font-family:var(--f-label);font-weight:700;font-size:15px;text-transform:uppercase}
.scout-m.lead{border-color:var(--foe)}
/* cooldown */
.mvb.cd{opacity:.5;filter:saturate(.4)}.cdtag{font-family:var(--f-label);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#4a3a5a;color:#e0d0ff;border-radius:4px;padding:1px 6px}
.mvb-cd{font-family:var(--f-label);font-size:12px;color:#c8b8e8}
/* partner intents */
.itags{display:grid;gap:3px;margin-top:4px}
.itag{font-family:var(--f-label);font-size:12px;letter-spacing:.02em;border:1px dashed var(--oc);color:#fff;border-radius:6px;padding:1px 6px;background:color-mix(in srgb,var(--oc) 14%,transparent)}
.itag.lk{border-style:solid;background:color-mix(in srgb,var(--oc) 32%,transparent)}.itag b{font-variant-numeric:tabular-nums}
.icomb{font-family:var(--f-label);font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.1);color:#fff}.icomb.ko{background:rgba(255,210,63,.3);color:#ffe27a}.icomb.ko2{background:rgba(255,210,63,.15);color:#ffe9a8}
.ptag{display:block;font-family:var(--f-label);font-size:12px;color:var(--oc);margin-top:2px}
.pj.comb{background:rgba(255,255,255,.12)}
.dock-plan{font-family:var(--f-label);font-size:13px;color:var(--oc);padding:4px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.dock-partner b,.dock-plan b{color:#fff}
.pbub{margin-top:4px;font-family:var(--f-label);font-size:13px;font-weight:700;color:#fff;background:var(--oc);border-radius:8px;padding:3px 8px;animation:pbub .35s ease-out}
@keyframes pbub{from{transform:scale(.6);opacity:0}}
.pingrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ping{font-family:var(--f-label);font-size:13px;letter-spacing:.03em;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}.ping:hover{border-color:var(--gold)}

.bbchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-label);font-weight:700;font-size:15px;color:#bff0a8;background:rgba(95,208,104,.12);border:1px solid rgba(143,232,154,.45);border-radius:999px;padding:1px 10px;white-space:nowrap}.bbchip small{font-size:11px;opacity:.8}
.shopgrid{display:grid;gap:8px}
.shopit{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-left:4px solid currentColor;border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer;color:var(--fg)}

.shopit .relbig{width:44px;height:44px;font-size:24px;border-radius:10px}.shopit .nm{font-family:var(--f-label);font-weight:700;font-size:15px;text-transform:uppercase}
.shopit.got{opacity:.55}
.price{font-family:var(--f-label);font-weight:700;font-size:15px;white-space:nowrap;border-radius:6px;padding:2px 8px}.price.ok{color:#bff0a8;background:rgba(95,208,104,.15)}.price.no{color:#ffaa9f;background:rgba(255,106,90,.12)}
.hud-tl .hud-l,.hud-tr .hud-r{position:static;display:flex}.hud-tr .hud-r{justify-content:flex-end}
@media (max-width:1100px){.hud-tl .hud-l,.hud-tr .hud-r{display:none}}

<script>

    const n=pts.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];const st=m(pts[n-1],pts[0]);s.moveTo(st[0],st[1]);for(let i=0;i<n;i++){const q=pts[i],nx=m(pts[i],pts[(i+1)%n]);s.quadraticCurveTo(q[0],q[1],nx[0],nx[1])}return s}

    function place(m,pos,o){pos=pos||[0,0,0];m.position.set(pos[0],pos[1],pos[2]);if(o.nt){const zN=V(o.nt[0][0],o.nt[0][1],o.nt[0][2]).normalize(),yT=V(o.nt[1][0],o.nt[1][1],o.nt[1][2]);yT.sub(zN.clone().multiplyScalar(yT.dot(zN))).normalize();const xX=V().crossVectors(yT,zN);m.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(xX,yT,zN));if(o.spin)m.rotateZ(o.spin)}else if(o.q){m.quaternion.setFromUnitVectors(UPV,V(o.q[0],o.q[1],o.q[2]).normalize());if(o.spin)m.rotateY(o.spin)}else if(o.rot)m.rotation.set(o.rot[0],o.rot[1],o.rot[2],o.ord||'XYZ');if(o.s)m.scale.set(o.s[0],o.s[1],o.s[2]);(o.par||body).add(m);return m}

    m.root.position.copy(SLOTPOS[i]);m.root.rotation.y=S.face;scene.add(m.root);slots[i]=S;

  }

  function sync(data,e){

    }
  }

  if(F.has('claws'))for(const s of [-1,1]){const cx=BC.x+s*32,cy=BC.y-4;front+=`<g transform="translate(${cx} ${cy}) scale(${s} 1)"><path d="M-8 10 Q-12 -10 2 -14 Q12 -12 10 -2 L2 -3 L5 6Z" fill="${c1}" ${OL}/></g>`}
  if(F.has('horn'))front+=poly([[hx-r*.2,hy-r*.75],[hx+(H.dir?-r*.1:0),hy-r*1.75],[hx+r*.2,hy-r*.75]],c2);
  if(F.has('crown'))front+=poly([[hx-r*.45,hy-r*.75],[hx-r*.45,hy-r*1.25],[hx-r*.22,hy-r*1.0],[hx,hy-r*1.45],[hx+r*.22,hy-r*1.0],[hx+r*.45,hy-r*1.25],[hx+r*.45,hy-r*.75]],'#ffd23f');
  if(F.has('halo'))front+=`<ellipse cx="${hx}" cy="${f1(hy-r-11)}" rx="${f1(r*.7)}" ry="5" fill="none" stroke="${INK}" stroke-width="6"/><ellipse cx="${hx}" cy="${f1(hy-r-11)}" rx="${f1(r*.7)}" ry="5" fill="none" stroke="#ffe680" stroke-width="3"/>`;
  if(F.has('gem'))front+=`<circle cx="${hx}" cy="${f1(hy-r*.55)}" r="4.5" fill="#6ff0ff" ${OL}/>`;
  const dx=H.dir===-1?-r*.14:0,sep=r*.38,ey=H.ey,er=Math.max(3.6,r*.2);
  if(F.has('cheeks'))for(const s of [-1,1])front+=`<circle cx="${f1(hx+s*r*.62+dx)}" cy="${f1(ey+er+3)}" r="${f1(r*.15)}" fill="#ff8aa8" opacity=".75"/>`;
  let eyes='';
  for(const s of [-1,1]){const x=hx+s*sep+dx;
    if(eye==='sleepy'){eyes+=`<path d="M${f1(x-er)} ${f1(ey)} Q${f1(x)} ${f1(ey+er*.9)} ${f1(x+er)} ${f1(ey)}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;continue}
    const ry=eye==='sly'?er*.62:er;
    eyes+=`<ellipse cx="${f1(x)}" cy="${f1(ey)}" rx="${f1(er)}" ry="${f1(ry)}" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${f1(x+dx*.25)}" cy="${f1(ey+.4)}" r="${f1(Math.min(ry,er*.58))}" fill="${INK}"/><circle cx="${f1(x-er*.28)}" cy="${f1(ey-ry*.35)}" r="${f1(er*.22)}" fill="#fff"/>`;
    if(eye==='fierce')eyes+=`<path d="M${f1(x-s*er*1.2)} ${f1(ey-er-3)} L${f1(x+s*er*.9)} ${f1(ey-er+1.5)}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
    if(eye==='sly')eyes+=`<path d="M${f1(x-er)} ${f1(ey-ry)} L${f1(x+er)} ${f1(ey-ry)}" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
  }

  return ART[sp]=`<svg class="mon" viewBox="-5 -16 130 134" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${back}${body}${front}${eyes}</svg>`;
}

function progressTrack(compact){const C=G&&G.cup;if(!C)return '';const n=C.ff?5:4;const nodes=[];

function setPlan(p,a){const b=G&&G.b;if(!b)return false;const cur=ui.plan[p]&&ui.plan[p].turn===b.turn?ui.plan[p].a:null;if(JSON.stringify(cur)===JSON.stringify(a||null))return false;
  ui.plan[p]={turn:b.turn,a:a||null};if((ui.mode==='host'||ui.mode==='guest')&&NET.r&&ui.me===p)NET.r.emit('intent',{gid:NET.gid,p,turn:b.turn,a:a||null}).catch(()=>{});return true}
function planOf(q){const b=G&&G.b;if(!b||b.over)return null;if(b.ch[q])return Object.assign({lock:true},b.ch[q]);if(b.ph!=='choose'||!alive(q))return null;
  const src=canControl(q)?ui.plan[q]:ui.rplan[q];const a=src&&src.turn===b.turn?src.a:null;return a?Object.assign({lock:false},a):null}
function planMove(q,pl){if(!pl)return null;if(pl.k==='move'&&pl.m!=null){const ms=mon(q).moves[pl.m];return ms?{mv:MOVES[ms.id],t:pl.t,mon:mon(q)}:null}
  if(pl.k==='switch'&&pl.m!=null&&pl.i!=null){const m=G.pl[q].party[pl.i];const ms=m&&m.moves[pl.m];return ms?{mv:MOVES[ms.id],t:pl.t,mon:m,sw:true}:null}return null}
function planTargets(q,pm){if(!pm)return [];if(pm.mv.tg==='one')return pm.t!=null&&alive(pm.t)?[pm.t]:[];if(pm.sw)return [];return targetsFor(q,pm.mv,null)}
function planText(q,pl){if(!pl)return '';if(pl.k==='switch'){const m=pl.i!=null?G.pl[q].party[pl.i]:null;const pm=planMove(q,pl);return m?`switching to ${mname(m)}${pm?' + '+pm.mv.n+(pm.t!=null&&alive(pm.t)?' → '+mname(mon(pm.t)):''):''}`:'thinking about switching'}

  for(const q of [0,1]){const pl=planOf(q),pm=planMove(q,pl);if(!pm||pm.sw||pm.mv.c==='X')continue;for(const t of planTargets(q,pm))if(t>=2)out.push({from:q,to:t,c:cols[q],lock:!!pl.lock})}return out}
function pctRange(q,t,pm){const tm=mon(t);const tg=planTargets(q,pm);const [lo,hi]=dmgRange(q,t,pm.mv,pm.mv.tg!=='one'&&tg.length>1);return [lo/tm.mhp*100,hi/tm.mhp*100]}
function intentTags(f){const b=G.b;if(!b||b.ph!=='choose'||!alive(f))return '';const tm=mon(f);let tags='',sum=[0,0],n=0;
  for(const q of [0,1]){const pl=planOf(q),pm=planMove(q,pl);if(!pm||pm.sw||!planTargets(q,pm).includes(f))continue;let lo=0,hi=0;

  if(n===2){const pin=(rel(0,'pincer')||rel(1,'pincer'))?1.25:1;const a=Math.round(sum[0]*pin),c=Math.round(sum[1]*pin);const hp=tm.hp/tm.mhp*100;const ko=a>=hp?'ko':c>=hp?'ko2':'';

function orderVs(p,q){const pp=planOf(p),pq=planOf(q);const pri=(i,pl)=>{if(!pl)return 0;if(pl.k==='switch')return 7;const pm=planMove(i,pl);if(!pm)return 0;return (pm.mv.pri||0)+((rel(i,'firststrike')&&!G.b.fs[i])||G.b.vol[i].mom?5:0)};

    case 'qst':{const x=P.party[M2.i],mv=MOVES[x.moves[M2.m].id];return `<span class="wait">${esc(mname(x))}'s ${esc(mv.n)}: which target?</span><div class="party pgrid">${tgtList(mv,f=>`data-do="qstarget" data-p="${p}" data-i="${M2.i}" data-m="${M2.m}" data-t="${f}"`,x)}</div><div class="row"><button class="btn ghost" data-do="qs" data-p="${p}" data-i="${M2.i}">Back</button></div>`}
  }

  return `<div class="mvgrid">${btns}</div><div class="row dock-act"><button class="btn" data-do="menu" data-p="${p}" data-v="switch" ${hasReserve(p)?'':'disabled'}>Switch${rel(p,'quickswap')?' + attack':''}</button></div>${pingRow(p)}`;
}

function moveDesc(mv){const bits=[];if(mv.pri>0)bits.push('Moves first');if(mv.tg==='foes')bits.push('Hits both foes');if(mv.tg==='all')bits.push('Hits everyone else, including your partner');if(mv.tg==='ally')bits.push(soloMode()?'Targets itself in solo play':'Targets your partner');if(mv.st)bits.push(`${mv.st[1]}% ${STN[mv.st[0]]}`);if(mv.sc){const k=Object.keys(mv.sc[0]);bits.push(k.map(x=>`${STATN[x]} ${mv.sc[0][x]>0?'+':''}${mv.sc[0][x]}`).join(', ')+(mv.sc[1]<100?` (${mv.sc[1]}%)`:''))}if(mv.drain)bits.push('Drains HP');if(mv.recoil)bits.push('Recoil');if(mv.heal)bits.push('Heals half HP');if(mv.prot)bits.push('Blocks attacks this turn');if(mv.help)bits.push(soloMode()?'Its own next move hits 1.5× harder':"Partner's move hits 1.5× harder");if(mv.crit)bits.push('High crit chance');if(mv.flinch)bits.push(`${mv.flinch}% flinch`);if(mv.hex)bits.push('Double power on statused foes');if(mv.pierce)bits.push('Goes through guards');if(mv.self)bits.push('Changes own stats');return bits.join(' · ')||'—'}
function overlays(){

  if(ui.relInfo&&RELICS[ui.relInfo]){const Rl=RELICS[ui.relInfo];h+=`<div class="scrim" data-do="relclose"><div class="modal" data-stop="1" style="--oc:var(--gold)"><div class="oc-m"><span class="relbig r-${Rl.r}">${Rl.ic}</span><div style="display:grid;gap:6px"><span class="row" style="gap:8px">${rarT(Rl.r,1)}${Rl.co?'<span class="label">Co-op</span>':''}</span><h3 style="font-family:var(--f-label);font-size:26px;text-transform:uppercase;margin:0">${esc(Rl.n)}</h3><p style="margin:0">${esc(Rl.d)}</p></div></div><div class="row"><button class="btn ghost" data-do="relclose">Close</button></div></div></div>`}

function summary(p,i,m){

   <div class="statg">${st.map(k=>`<span>${lab[k]}</span><span>${m.s[k]}</span><span class="sbar"><i style="width:${Math.min(100,m.s[k]/1.9)}%"></i></span>`).join('')}</div>

/* ================= ANIMATION ================= */
function pump(){
  if(ui.playing||!G)return;
  const q=G.evq.filter(e=>e.id>ui.played);
  if(!q.length){if(ui.cur){ui.cur=null;ui.fast=false;render()}return}
  const e=q[0];ui.playing=true;ui.cur=e;render();try{V3.onEvent(e)}catch(err){console.error('3D disabled:',err);V3.ok=false;render()}
  let dur=ui.fast?120:q.length>24?260:(e.d||Math.min(1700,650+e.t.length*14));if(soloMode()&&!ui.fast)dur=Math.round(dur*.72);
  setTimeout(()=>{ui.played=e.id;ui.playing=false;pump()},dur);
}

/* ================= ONLINE: PeerJS room adapter ================= */
function mkBus(){const H={};return{on(t,f){(H[t]=H[t]||[]).push(f);return()=>{H[t]=(H[t]||[]).filter(x=>x!==f)}},fire(t,m){(H[t]||[]).slice().forEach(f=>{try{f(m)}catch(e){console.error(e)}})}}}
function peerRoom(){
  if(typeof Peer==='undefined')return null;
  const PFX='chimpokomon-v1-';
  return{join(name,role){return role==='host'?hostRoom(PFX+name):guestRoom(PFX+name)}};
}
function hostRoom(id){return new Promise((res,rej)=>{let tries=0;
  const start=()=>{
    const peer=new Peer(id);let opened=false;const conns=new Set();const bus=mkBus();const pl=[];
    const peersArr=()=>[{peer:'host',isMe:true,presence:{role:'host'}},...[...conns].map(c=>({peer:c.peer,isMe:false,presence:{role:'guest'}}))];
    const notify=()=>{const ps=peersArr();pl.forEach(f=>{try{f({peers:ps})}catch(e){}})};
    peer.on('open',()=>{opened=true;res({
      emit:async(t,d)=>{for(const c of conns)if(c.open)c.send({t,d})},
      on:(t,f)=>bus.on(t,f),presence:async()=>{},peers:peersArr,
      onPeers:f=>{pl.push(f);setTimeout(()=>f({peers:peersArr()}),0);return()=>{}},
      leave:async()=>{try{peer.destroy()}catch(e){}}})});
    peer.on('connection',c=>{
      c.on('open',()=>{conns.add(c);notify()});
      c.on('data',m=>{if(m&&typeof m.t==='string')bus.fire(m.t,{topic:m.t,data:m.d,peer:c.peer,isMe:false})});
      c.on('close',()=>{conns.delete(c);notify()});c.on('error',()=>{conns.delete(c);notify()})});
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{if(!opened){try{peer.destroy()}catch(x){}if(e&&e.type==='unavailable-id'&&tries++<5)setTimeout(start,2500);else rej(e)}});
  };start()})}
function guestRoom(id){return new Promise((res,rej)=>{
  const peer=new Peer();const bus=mkBus();let conn=null,resolved=false,closed=false;
  const api={emit:async(t,d)=>{if(conn&&conn.open)conn.send({t,d})},on:(t,f)=>bus.on(t,f),presence:async()=>{},peers:()=>[],onPeers:()=>()=>{},
    leave:async()=>{closed=true;try{peer.destroy()}catch(e){}}};
  const connect=()=>{if(closed)return;const c=peer.connect(id,{reliable:true});
    c.on('open',()=>{conn=c;if(!resolved){resolved=true;res(api)}else bus.fire('_reconnect',{})});
    c.on('data',m=>{if(m&&typeof m.t==='string')bus.fire(m.t,{topic:m.t,data:m.d,peer:'host',isMe:false})});
    c.on('close',()=>{if(conn===c)conn=null;if(!closed)setTimeout(connect,3000)})};
  peer.on('open',connect);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e&&e.type==='peer-unavailable'){if(!resolved){resolved=true;closed=true;try{peer.destroy()}catch(x){}rej(new Error('notfound'))}else if(!closed)setTimeout(connect,3000)}else if(!resolved){resolved=true;rej(e)}});
  setTimeout(()=>{if(!resolved){resolved=true;closed=true;try{peer.destroy()}catch(x){}rej(new Error('timeout'))}},15000);
})}

/* ================= COMMANDS / NET ================= */
function save(){if(ui.mode==='solo'){try{localStorage.setItem('chimpokomon.solo',JSON.stringify({v:3,mode:'solo',seed:SEED,name:ui.name,log:LOG}))}catch(e){}return}if(ui.mode!=='local'&&ui.mode!=='host')return;try{localStorage.setItem('chimpokomon.save',JSON.stringify({v:3,mode:ui.mode,code:NET.code,gid:NET.gid,seed:SEED,name:ui.name,log:LOG}))}catch(e){}}
function onChange(){if(ui.sum){const P=G.pl[ui.sum.p];if(!P||!P.party[ui.sum.i])ui.sum=null}render();pump()}
function hostCmd(c){if(!apply(c)){render();return false}LOG.push(c);save();if(ui.mode==='host'&&NET.r)NET.r.emit('cmd',{gid:NET.gid,seq:LOG.length-1,cmd:c}).catch(()=>{});onChange();return true}
function send(c){
  if(c.p!=null){ui.menu[c.p]={v:'root'};if(c.k==='act'||c.k==='replace')ui.dockP=null}
  if(ui.mode==='guest'){if(!NET.r)return;NET.r.emit('act',{cmd:c}).catch(()=>{ui.err='Could not reach the host.';render()});render();return}
  hostCmd(c);
}
function sanitize(c,p){
  if(!c||typeof c!=='object'||typeof c.k!=='string'||c.k==='setup')return null;
  const o={k:c.k};if(PCMDS.has(c.k))o.p=p;
  if(Array.isArray(c.ids))o.ids=c.ids.slice(0,2).map(String);
  for(const k of ['i','slot','uid'])if(Number.isInteger(c[k]))o[k]=c[k];
  if(c.a&&typeof c.a==='object'){const a=c.a;o.a={k:String(a.k||'')};for(const k of ['m','t','i'])if(Number.isInteger(a[k]))o.a[k]=a[k]}
  return o;
}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=new Uint32Array(6);crypto.getRandomValues(r);for(const x of r)s+=A[x%A.length];return s}
function genSeed(){const r=new Uint32Array(1);crypto.getRandomValues(r);return r[0]|0}
function replay(log){for(const c of log){if(apply(c))LOG.push(c)}ui.played=G.evId;ui.cur=null}
function chunks(from){const out=[];let cur=[],size=0;for(let k=from;k<LOG.length;k++){const s=JSON.stringify(LOG[k]).length+1;if(size+s>3000&&cur.length){out.push({from:k-cur.length,cmds:cur});cur=[];size=0}cur.push(LOG[k]);size+=s}out.push({from:LOG.length-cur.length,cmds:cur});return out}
async function sendSync(from){if(!NET.r)return;from=isInt(from,0,LOG.length)?from:0;for(const ch of chunks(from)){try{await NET.r.emit('sync',{gid:NET.gid,seed:SEED,from:ch.from,cmds:ch.cmds,total:LOG.length})}catch(e){return}}}
async function hostOnline(resume){
  ui.err='';const room=NET.room;if(!room){ui.err='Online rooms are not available here.';render();return}
  const code=resume?resume.code:genCode();let r;
  try{r=await room.join(code.toLowerCase(),'host')}catch(e){ui.err=e&&e.type==='unavailable-id'?'That room code is still in use. Wait a few seconds and try again.':'Could not reach the matchmaking server. Check your connection and try again.';render();return}
  NET.r=r;NET.code=code;ui.mode='host';ui.me=0;LOG=[];
  if(resume){SEED=resume.seed;NET.gid=resume.gid||genCode();newGame(SEED);replay(resume.log)}else{SEED=genSeed();NET.gid=genCode()+genCode();newGame(SEED)}
  r.presence({role:'host'}).catch(()=>{});
  r.on('hello',msg=>{if(msg.isMe)return;
    NET.guestPeer=msg.peer;const gname=cleanName(msg.data&&msg.data.name,'Trainer 2');
    if(G.phase==='lobby')hostCmd({k:'setup',names:[ui.name||'Trainer 1',gname]});else sendSync(0)});
  r.on('act',msg=>{if(msg.isMe||msg.peer!==NET.guestPeer)return;const c=sanitize(msg.data&&msg.data.cmd,1);if(c)hostCmd(c)});
  r.on('resync',msg=>{if(msg.isMe||msg.peer!==NET.guestPeer)return;sendSync(msg.data&&msg.data.from)});
  r.on('intent',msg=>{if(msg.isMe||msg.peer!==NET.guestPeer)return;onIntent(msg,1)});
  r.on('ping',msg=>{if(msg.isMe||msg.peer!==NET.guestPeer)return;onPing(msg,1)});
  r.onPeers(ch=>{const was=NET.partner;NET.partner=ch.peers.some(x=>!x.isMe&&x.presence&&x.presence.role==='guest');if(was!==NET.partner)render()});
  clearInterval(NET.beat);NET.beat=setInterval(()=>{r.emit('beat',{gid:NET.gid,seq:LOG.length}).catch(()=>{})},3000);
  save();onChange();
}
function requestResync(from){const now=Date.now();if(now-NET.lastResync<1500||!NET.r)return;NET.lastResync=now;NET.r.emit('resync',{from}).catch(()=>{})}
function guestApply(c){if(apply(c)){LOG.push(c);return true}NET.gid='';requestResync(0);return false}
async function joinOnline(code){
  ui.err='';const room=NET.room;if(!room){ui.err='Online rooms are not available here.';render();return}
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6){ui.err='Room codes are 6 letters and numbers.';render();return}
  let r;try{r=await room.join(code.toLowerCase(),'guest')}catch(e){ui.err=e&&e.message==='notfound'?'No room with that code. Check it, and make sure the host has the game open.':'Could not connect to that room. Check your connection and try again.';ui.mode=null;render();return}
  NET.r=r;NET.code=code;ui.mode='guest';ui.me=1;G=null;LOG=[];NET.gid='';
  r.presence({role:'guest'}).catch(()=>{});
  r.on('sync',msg=>{if(msg.isMe)return;const d=msg.data;if(!d||!Array.isArray(d.cmds)||!Number.isInteger(d.from))return;NET.hostSeen=Date.now();
    let fresh=false;
    if(d.gid!==NET.gid){if(d.from!==0){requestResync(0);return}NET.gid=d.gid;SEED=d.seed|0;newGame(SEED);LOG=[];fresh=true}
    if(d.from>LOG.length){requestResync(LOG.length);return}
    const start=LOG.length-d.from;for(let k=start;k<d.cmds.length;k++){if(!guestApply(d.cmds[k]))return}
    if(fresh||d.cmds.length>6){ui.played=G.evId;ui.cur=null}
    clearInterval(NET.hello);onChange()});
  r.on('cmd',msg=>{if(msg.isMe)return;const d=msg.data;if(!d)return;NET.hostSeen=Date.now();if(d.gid!==NET.gid||!G){requestResync(0);return}
    if(d.seq===LOG.length){if(guestApply(d.cmd))onChange()}else if(d.seq>LOG.length)requestResync(LOG.length)});
  r.on('intent',msg=>{if(msg.isMe)return;onIntent(msg,0)});
  r.on('ping',msg=>{if(msg.isMe)return;onPing(msg,0)});
  r.on('beat',msg=>{if(msg.isMe)return;const d=msg.data||{};const was=Date.now()-NET.hostSeen<9000;NET.hostSeen=Date.now();
    if(d.gid!==NET.gid)requestResync(0);else if(d.seq>LOG.length)requestResync(LOG.length);if(!was)render()});
  const hello=()=>r.emit('hello',{name:ui.name||'Trainer 2'}).catch(()=>{});
  r.on('_reconnect',()=>{NET.gid&&requestResync(LOG.length);hello()});
  hello();clearInterval(NET.hello);NET.hello=setInterval(()=>{if(!NET.gid)hello();else clearInterval(NET.hello)},2000);
  try{localStorage.setItem('chimpokomon.guest',JSON.stringify({code,name:ui.name}))}catch(e){}
  render();
  setInterval(()=>{if(ui.mode==='guest')render()},10000);
}
function startSolo(resume){
  ui.mode='solo';ui.me=0;LOG=[];NET.code='';
  if(resume){SEED=resume.seed;newGame(SEED);replay(resume.log)}
  else{SEED=genSeed();newGame(SEED);hostCmd({k:'setup',solo:true,names:[ui.name||'Trainer 1','']})}
  save();onChange();
}
function startLocal(resume){
  ui.mode='local';ui.me=null;LOG=[];NET.code='';
  if(resume){SEED=resume.seed;newGame(SEED);replay(resume.log)}
  else{SEED=genSeed();newGame(SEED);hostCmd({k:'setup',names:[ui.name||'Trainer 1',ui.name2||'Trainer 2']})}

function leave(){
  if(NET.r){NET.r.leave().catch(()=>{});NET.r=null}clearInterval(NET.beat);clearInterval(NET.hello);
  ui.mode=null;ui.me=null;G=null;LOG=[];ui.cur=null;ui.playing=false;ui.sum=null;ui.pick=[[],[]];ui.menu=[{v:'root'},{v:'root'}];ui.lastPhase=null;render();
}
function onClick(e){
  const el=e.target.closest('[data-do]');if(!el||el.disabled)return;
  if((el.dataset.do==='sumclose'||el.dataset.do==='relclose')&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  const d=el.dataset,p=d.p!=null?+d.p:null;
  switch(d.do){
    case 'host':ui.name=cleanName(document.getElementById('nm').value,'Trainer 1');hostOnline(null);break;
    case 'join':ui.name=cleanName(document.getElementById('nm').value,'Trainer 2');ui.joinCode=document.getElementById('jc').value;joinOnline(ui.joinCode);break;
    case 'solo':ui.name=cleanName(document.getElementById('nms').value,'Trainer 1');startSolo(null);break;
    case 'resumesolo':{let s=null;try{s=JSON.parse(localStorage.getItem('chimpokomon.solo'))}catch(err){}if(!s||s.v!==3)return;ui.name=s.name||ui.name;startSolo(s);break}
    case 'forgetsolo':try{localStorage.removeItem('chimpokomon.solo')}catch(err){}render();break;
    case 'local':ui.name=cleanName(document.getElementById('nm1').value,'Trainer 1');ui.name2=cleanName(document.getElementById('nm2').value,'Trainer 2');startLocal(null);break;
    case 'resume':{let s=null;try{s=JSON.parse(localStorage.getItem('chimpokomon.save'))}catch(err){}if(!s||s.v!==3)return;ui.name=s.name||ui.name;if(s.mode==='host')hostOnline(s);else startLocal(s);break}
    case 'forget':try{localStorage.removeItem('chimpokomon.save')}catch(err){}render();break;
    case 'leave':leave();break;
    case 'copy':{const t=NET.code;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{el.textContent='Copied'},()=>{el.textContent=t});else el.textContent=t;break}
    case 'pick':{const s=d.s,a=ui.pick[p];const k=a.indexOf(s);if(k>=0)a.splice(k,1);else if(a.length<2)a.push(s);else{a.shift();a.push(s)}render();break}
    case 'confirm':send({k:'starters',p,ids:ui.pick[p].slice()});break;
    case 'ready':send({k:'ready',p});break;
    case 'sum':ui.sum={p,i:+d.i};render();break;
    case 'sumclose':ui.sum=null;render();break;
    case 'lead':ui.sum=null;send({k:'lead',p,i:+d.i});break;
    case 'reward':send({k:'reward',p,i:+d.i});break;
    case 'draft':send({k:'draft',p,i:+d.i});break;
    case 'evolve':send({k:'evolve',p,uid:+d.uid});break;
    case 'menu':ui.menu[p]={v:d.v};if(G&&G.b&&G.phase==='battle')setPlan(p,d.v==='switch'?{k:'switch',i:null}:null);render();break;
    case 'move':{const m=+d.m;
      const mv=MOVES[mon(p).moves[m].id];const foes=[2,3].filter(alive);
      if(mv.tg==='one'&&foes.length>1){ui.menu[p]={v:'target',m};setPlan(p,{k:'move',m,t:null});render()}else{setPlan(p,{k:'move',m,t:foes[0]});send({k:'act',p,a:{k:'move',m,t:foes[0]}})}break}
    case 'target':setPlan(p,{k:'move',m:+d.m,t:+d.t});send({k:'act',p,a:{k:'move',m:+d.m,t:+d.t}});break;
    case 'switch':setPlan(p,{k:'switch',i:+d.i});send({k:'act',p,a:{k:'switch',i:+d.i}});break;
    case 'qs':ui.menu[p]={v:'qs',i:+d.i};setPlan(p,{k:'switch',i:+d.i});render();break;
    case 'qsmove':{const i=+d.i,m=+d.m;const mv=MOVES[G.pl[p].party[i].moves[m].id];const foes=[2,3].filter(alive);
      if(mv.tg==='one'&&foes.length>1){ui.menu[p]={v:'qst',i,m};setPlan(p,{k:'switch',i,m,t:null});render()}else{setPlan(p,{k:'switch',i,m,t:foes[0]});send({k:'act',p,a:{k:'switch',i,m,t:foes[0]}})}break}
    case 'qstarget':send({k:'act',p,a:{k:'switch',i:+d.i,m:+d.m,t:+d.t}});break;
    case 'ping':{if(!NET.r)break;const t=d.t!=null?+d.t:null;NET.r.emit('ping',{gid:NET.gid,p,kind:d.k,t}).catch(()=>{});addPing(p,d.k,t);break}
    case 'relinfo':ui.relInfo=d.id;render();break;
    case 'buy':send({k:'buy',p,i:+d.i});break;
    case 'shopdone':send({k:'shopdone',p});break;
    case 'boon':send({k:'boon',p,i:+d.i});break;
    case 'relclose':ui.relInfo=null;render();break;
    case 'undo':send({k:'undo',p});break;
    case 'replace':send({k:'replace',p,i:+d.i});break;
    case 'learn':send({k:'learn',p,slot:+d.slot});break;
    case 'skip':ui.fast=true;break;
    case 'focusfoe':ui.focusFoe=+d.t;render();break;
    case 'togglelog':ui.logOpen=!ui.logOpen;render();break;
    case 'dockp':ui.dockP=p;render();break;
  }
}
function onInput(e){const id=e.target.id;if(id==='nm'||id==='nm1')ui.name=e.target.value;else if(id==='nm2')ui.name2=e.target.value;else if(id==='nms')ui.name=e.target.value;else if(id==='jc')ui.joinCode=e.target.value}
function boot(){
  try{const g=JSON.parse(localStorage.getItem('chimpokomon.guest')||'null');if(g){ui.joinCode=g.code||'';ui.name=g.name||''}}catch(e){}
  document.addEventListener('click',onClick);document.addEventListener('input',onInput);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.sum||ui.relInfo)){ui.sum=null;ui.relInfo=null;render()}});
  document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-hov]');if(!el||el.disabled||!G||!G.b)return;const d=el.dataset,p=+d.p;if(!canControl(p))return;
    if(d.do==='target')setPlan(p,{k:'move',m:+d.m,t:+d.t});else if(d.do==='qstarget')setPlan(p,{k:'switch',i:+d.i,m:+d.m,t:+d.t});else if(d.do==='switch'||d.do==='qs')setPlan(p,{k:'switch',i:+d.i})});
  render();
  NET.room=peerRoom();ui.roomState=NET.room?'ok':'none';render();
}
if(typeof document!=='undefined'&&document.getElementById('app'))boot();
</script>
