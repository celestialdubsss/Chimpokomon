<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Chimpokomon: a two-player co-op roguelike creature battler.">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Chimpokomon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Cinzel+Decorative:wght@700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: night-stadium broadcast. Scoreboard header, turf battlefield, side rail of action panels. Single dark theme by choice. */
:root{
  --bg:#140f0c; --bg2:#1d1611; --panel:#241b15; --panel2:#30241b; --line:#4d3b2a;
  --fg:#f5ecdb; --muted:#bba98c; --flood:#e9b949; --flood-ink:#2a1a04;
  --gold:#e9b949; --gold-hi:#f8dc8a; --stone:#d9cbb2; --royal:#2c4fb8; --royal-d:#1b3070; --velvet:#8e1f2a; --purple:#6a2fa8;
  --p1:#ff6f5e; --p2:#4fb8ff; --foe:#d9a6ff;
  --good:#5fd068; --warn:#ffd23f; --bad:#ff5a4f;
  --f-display:'Cinzel','Trajan Pro','Times New Roman',serif;
  --f-logo:'Cinzel Decorative','Cinzel','Times New Roman',serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{background:radial-gradient(ellipse 120% 60% at 50% -10%,#3a2a1d,transparent 60%),radial-gradient(ellipse 80% 50% at 50% 120%,#24140f,transparent 70%),var(--bg);background-attachment:fixed}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 14px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent) 1;margin-bottom:18px}
.brand{font-family:var(--f-logo);font-weight:900;font-size:22px;letter-spacing:.04em;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#a87420);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--f-label);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg2)}
.pill.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.pill.off{color:var(--bad)}
h1,h2,h3{text-wrap:balance;margin:0}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:15px;background:linear-gradient(180deg,#3d2f24,#2a2019);border:1px solid #6b5238;border-radius:7px;padding:10px 14px;cursor:pointer;transition:transform .08s,filter .15s;box-shadow:inset 0 1px 0 rgba(255,230,180,.12),0 2px 0 rgba(0,0,0,.35)}
.btn:hover:not(:disabled){filter:brightness(1.18)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#b98325);color:var(--flood-ink);border-color:#f8dc8a;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #6a4510,0 0 18px rgba(233,185,73,.25)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.p0{border-color:var(--p1)} .btn.p1{border-color:var(--p2)}
:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
input[type=text]{font:inherit;font-size:16px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);width:100%;min-width:0}
.c0{color:var(--p1)} .c1{color:var(--p2)}
.ty{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--tc)}
.tys{display:inline-flex;gap:4px;flex-wrap:wrap}
.st{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:11px;padding:1px 5px;border-radius:3px;color:#120e0a;letter-spacing:.05em}
.st.brn{background:#ff8a4a}.st.par{background:#f5cc2a}.st.psn{background:#c27ae0}.st.slp{background:#b8b8c8}.st.frz{background:#8ad8e0}

/* Lobby */
.hero{position:relative;padding:28px 0 8px;display:grid;gap:18px}
.hero h1{font-family:var(--f-display);font-size:clamp(40px,9vw,92px);line-height:.95;letter-spacing:.01em;text-shadow:4px 4px 0 var(--p1),-4px -4px 0 var(--p2)}
.hero p{max-width:60ch;color:var(--muted);font-size:17px;margin:0}
.lineup{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.lineup .mon{width:clamp(80px,16vw,130px);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;display:flex;gap:8px;align-items:center;background:var(--bg2)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--flood);color:var(--flood-ink);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.card{background:linear-gradient(180deg,#2c2219,#1f1712);border:1px solid var(--line);border-top:2px solid rgba(233,185,73,.55);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0;box-shadow:inset 0 0 0 1px rgba(233,185,73,.08),0 10px 30px rgba(0,0,0,.35)}
.card h3{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--stone)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:600}
.code{font-family:var(--f-display);font-size:clamp(40px,10vw,72px);letter-spacing:.12em;color:var(--flood)}

/* Starter select */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sc{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;justify-items:center;text-align:center;cursor:pointer;min-width:0}
.sc .mon{width:96px;height:96px}
.sc .nm{font-family:var(--f-label);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.sc.sel0{border-color:var(--p1);box-shadow:0 0 0 3px color-mix(in srgb,var(--p1) 30%,transparent)}
.sc.sel1{border-color:var(--p2);box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 30%,transparent)}
.sc:disabled{cursor:not-allowed;opacity:.4}
.sbars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;width:100%;font-family:var(--f-label);font-size:11px;color:var(--muted);align-items:center;text-align:left}
.sbar{height:5px;border-radius:3px;background:#3a2c20;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--flood)}

/* Generic layouts */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph h3{font-family:var(--f-label);font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.bigtitle{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,7vw,60px);line-height:1;letter-spacing:.02em;color:var(--stone);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.party{display:grid;gap:6px}
.pc{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left;width:100%}
.pc:hover{border-color:#7a5c3a}
.pc .mon{width:52px;height:52px}
.pc .nm{font-family:var(--f-label);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.pc.down{opacity:.5}
.pc .lv{font-family:var(--f-label);color:var(--muted);font-variant-numeric:tabular-nums}
.bag{display:flex;gap:6px;flex-wrap:wrap}
.bag span{font-family:var(--f-label);font-size:13px;letter-spacing:.04em;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.bracket{display:grid;gap:6px}
.match{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.match.cur{border-color:var(--flood)}
.match .r{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;font-size:13px}
.match .o{font-weight:600;min-width:0}
.res{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.res.w{color:var(--good)} .res.n{color:var(--flood)}
.readyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.hpbar{height:7px;border-radius:4px;background:#0a120f;overflow:hidden;border:1px solid #000}
.hpfill{height:100%;width:var(--to);background:var(--hc);animation:hpd .55s ease-out}
@keyframes hpd{from{width:var(--from)}}
.hpnum{font-family:var(--f-label);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Battle */
.battle{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:900px){.battle{grid-template-columns:minmax(0,1fr)}}
.field{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);padding:14px;display:grid;gap:4px;
  background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(255,236,170,.28),transparent 70%),repeating-linear-gradient(90deg,#3b2f22 0 56px,#33281d 56px 112px)}
.field.wild{background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(200,255,200,.16),transparent 70%),repeating-linear-gradient(100deg,var(--ac) 0 40px,color-mix(in srgb,var(--ac) 82%,#000) 40px 80px)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow.foes{padding-left:14%}
.frow.allies{padding-right:14%}
@media (max-width:560px){.frow.foes{padding-left:0}.frow.allies{padding-right:0}.field{padding:10px}.plate .l1{flex-wrap:wrap}.plate .nm{white-space:normal;overflow-wrap:anywhere;font-size:15px}}
.spot{display:grid;justify-items:center;gap:4px;min-width:0}
.spot .sprite{width:clamp(76px,17vw,138px);aspect-ratio:1;max-width:100%;position:relative}
.spot .sprite svg{width:100%;height:100%;display:block}
.spot .shadow{width:70%;height:10px;border-radius:50%;background:rgba(0,0,0,.35);margin-top:-14px}
.spot.empty .sprite{opacity:.0}
.plate{width:100%;max-width:220px;background:rgba(20,14,10,.86);border-radius:8px;padding:6px 8px;border-left:4px solid var(--oc);display:grid;gap:3px;min-width:0}
.plate .l1{display:flex;justify-content:space-between;gap:6px;align-items:baseline;min-width:0}
.plate .nm{font-family:var(--f-label);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .lv{font-family:var(--f-label);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.plate .own{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--oc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ally .sprite svg{transform:scaleX(-1)}
.hit .sprite{animation:hit .45s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-8px);filter:brightness(2.2)}40%{transform:translateX(7px)}60%{transform:translateX(-4px);filter:brightness(1.8)}}
.faint .sprite{animation:faint .7s forwards}
@keyframes faint{to{transform:translateY(30%) scale(.6);opacity:0}}
.in .sprite{animation:pop .45s}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.heal .sprite{animation:glow .6s}
@keyframes glow{50%{filter:brightness(1.4) drop-shadow(0 0 12px #9effa0)}}
.up .sprite{animation:up .5s}
@keyframes up{50%{transform:translateY(-8px)}}
.down .sprite{animation:dn .5s}
@keyframes dn{50%{transform:translateY(6px);filter:saturate(.3)}}
.ball .sprite{animation:wob .55s}
@keyframes wob{25%{transform:rotate(-12deg) scale(.7)}75%{transform:rotate(12deg) scale(.7)}}
.caught .sprite{animation:faint .9s forwards}
.logbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:76px;display:grid;gap:8px}
.logline{font-size:17px;font-weight:600}
.loghist{font-size:13px;color:var(--muted);max-height:110px;overflow:auto;display:grid;gap:2px}
.rail{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;border-top:4px solid var(--oc)}
.panel .who{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--oc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv{display:grid;gap:3px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.mv:hover:not(:disabled){background:#3a2c20}
.mv:disabled{opacity:.4;cursor:not-allowed}
.mv .n{font-family:var(--f-label);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .d{font-family:var(--f-label);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ef{font-family:var(--f-label);font-weight:700;font-size:11px;border-radius:3px;padding:0 4px}
.ef.s{background:var(--good);color:#0d1a08}.ef.w{background:#5a6a62;color:#e8efe9}.ef.z{background:var(--bad);color:#200806}
.opt{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px 4px 4px;cursor:pointer;text-align:left;width:100%}
.opt .mon{width:44px;height:44px}
.opt:disabled{opacity:.4;cursor:not-allowed}
.wait{font-family:var(--f-label);letter-spacing:.04em;color:var(--muted);font-size:16px}

.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.pips i.on{background:var(--flood);border-color:var(--flood)}
.offers{display:grid;gap:8px}
.oc{display:grid;gap:6px;text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.oc:hover:not(:disabled){border-color:#8a6a44}
.oc:disabled{cursor:default}
.oc:disabled:not(.sel0):not(.sel1){opacity:.45}
.oc.sel0{border-color:var(--p1)} .oc.sel1{border-color:var(--p2)}
.oc .nm{font-family:var(--f-label);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.oc-m{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.oc-m .mon{width:56px;height:56px}
.match.boss .r{color:var(--foe)}
.evo-opt{grid-template-columns:44px 1fr 44px}
.field.ff{background:radial-gradient(ellipse 70% 55% at 50% -12%,rgba(217,166,255,.30),transparent 70%),repeating-linear-gradient(90deg,#2a1838 0 56px,#24142f 56px 112px)}
img.mon{object-fit:contain;display:block}
@keyframes evoout{0%{filter:none}55%{filter:brightness(3.5) saturate(0)}100%{filter:brightness(4) saturate(0);opacity:.25;transform:scale(.85)}}
@keyframes evoin{0%{opacity:0;transform:scale(.3);filter:brightness(4)}100%{opacity:1;transform:none;filter:none}}
.stage3d{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9.5;background:#0a0f0d;min-height:300px}
@media (max-width:700px){.stage3d{aspect-ratio:auto;height:min(118vw,520px)}}
.stage-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px;z-index:2}
.hrow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hud .plate{max-width:min(46%,220px);backdrop-filter:blur(2px)}
.hud .plate.ghost{visibility:hidden}
.hud .plate.ko{opacity:.45}
.vs{position:absolute;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;gap:10px;background:radial-gradient(ellipse at center,rgba(12,8,5,.55),rgba(12,8,5,.85));text-align:center;padding:16px;animation:vsfade 2.3s both}
@keyframes vsfade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.vs-lab{font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--flood);font-weight:700;animation:slam .6s .1s both}
.vs-title{font-family:var(--f-display);font-size:clamp(22px,5vw,40px);color:var(--foe);animation:slam .7s .25s both}
.vs-row{display:flex;align-items:center;gap:clamp(10px,3vw,30px)}
.vs-side{display:grid;gap:2px;font-family:var(--f-label);font-size:clamp(16px,3.2vw,26px);text-transform:uppercase;letter-spacing:.04em}
.vs-side.l{animation:inl .6s .35s cubic-bezier(.2,1.4,.4,1) both;text-align:right}
.vs-side.r{animation:inr .6s .35s cubic-bezier(.2,1.4,.4,1) both;text-align:left}
.vs-x{font-family:var(--f-display);font-size:clamp(36px,8vw,72px);color:var(--flood);text-shadow:3px 3px 0 var(--p1),-3px -3px 0 var(--p2);animation:slam .5s .6s cubic-bezier(.2,1.6,.4,1) both}
.vs-venue{font-family:var(--f-label);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;animation:slam .5s .9s both}
.vs-boss .vs-x,.vs-ff .vs-x{color:var(--foe)}
@keyframes inl{from{opacity:0;transform:translateX(-80px)}}
@keyframes inr{from{opacity:0;transform:translateX(80px)}}
@keyframes slam{0%{opacity:0;transform:scale(2.2)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:none}}
[data-slam]{animation:slam .7s cubic-bezier(.2,1.5,.4,1) both}
[data-rv]{animation:rvin .8s cubic-bezier(.2,1.3,.35,1) both;position:relative}
@keyframes rvin{0%{opacity:0;transform:perspective(700px) translateY(34px) rotateX(75deg) scale(.82);filter:brightness(3)}55%{opacity:1;filter:brightness(1.8)}100%{opacity:1;transform:none;filter:none}}
.dramahead{display:grid;gap:4px;margin:4px 0 16px}
.titlecard{border-radius:16px;padding:22px;margin-bottom:16px;display:grid;gap:8px;justify-items:start;border:1px solid var(--line);background:linear-gradient(120deg,#2a1438,#1d1611 70%);box-shadow:inset 0 0 0 1px rgba(217,166,255,.25)}
.titlecard.boss{background:linear-gradient(120deg,#3a2408,#1d1611 70%);box-shadow:inset 0 0 0 1px rgba(255,210,63,.3)}
.titlecard h2{font-family:var(--f-display);font-size:clamp(28px,6vw,52px);line-height:1;color:var(--foe)}
.titlecard.boss h2{color:var(--flood)}
.titlecard p{margin:0;font-family:var(--f-label);font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.tc-venue{font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:13px}
.rar{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor;justify-self:center}

/* ---- Battle HUD ---- */
.bwrap{position:relative}

.pj.ko{background:rgba(255,210,63,.22);color:#ffe27a;font-weight:700}
.pj.ko2{background:rgba(255,210,63,.1);color:#ffe9a8}
.pj.ally{background:rgba(255,122,89,.18);color:#ffb39f}
.pj.z{opacity:.6}
.pj em{font-style:normal;font-weight:700}.pj .se{color:#8ff09a}.pj .nve{color:#c8d0d8}
.dock-act .btn{padding:6px 14px;font-size:13px}
.pgrid{grid-template-columns:1fr 1fr}
.blog{position:absolute;right:10px;bottom:10px;width:min(330px,30%);z-index:3;background:rgba(20,14,10,.88);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;backdrop-filter:blur(3px)}

.blog.closed .blog-h{border-bottom:0}
.blog-b{max-height:190px;overflow:auto;padding:6px 10px;display:grid;gap:3px;font-size:13px}
.blog-b .c0{color:#ffb39f}.blog-b .c1{color:#8fe6dc}.blog-b .fo{color:#e2c4ff}
@media (max-width:1100px){.hud-l,.hud-r{display:none}}
@media (max-width:900px){
  .dock,.blog{position:static;width:auto;margin-top:10px}
  .arena,.arena.stage3d{aspect-ratio:auto;height:min(120vw,540px)}
  .hud-tl,.hud-tr{width:calc(50% - 15px)}
  .hud-tc{top:auto;bottom:10px;width:calc(100% - 20px)}
  .hpnl{grid-template-columns:30px minmax(0,1fr);gap:6px;padding:5px 6px}
  .hp-por{width:30px;height:30px}
  .hp-name b{font-size:14px}
  .hp-foot .tys{display:none}
  .arena.field2d{padding-top:150px}
}
@media (max-width:520px){.mvgrid,.pgrid{grid-template-columns:1fr}.turnb{font-size:14px;padding:2px 12px}}

/* ---- Colosseum title screen ---- */

      if(f.k==='hit'){s.anim={k:'hit',t0:now(),dur:.5};cheer=Math.min(1,cheer+.35)}
      else if(f.k==='faint'){s.anim={k:'faint',t0:now(),dur:.9};s.m.root.visible=true;cheer=1;shake=Math.max(shake,.12)}
      else if(f.k==='in'){s.anim={k:'in',t0:now(),dur:.7}}
      else if(f.k==='heal'||f.k==='up'||f.k==='down'){const at=headPos(f.s);const up=f.k!=='down';const c=f.k==='heal'?'#7aff9a':f.k==='up'?'#ffd23f':'#7aa8ff';for(let k=0;k<12;k++){const m=particle(up?'shard':'shard',c,.08,true);const a=Math.random()*PI*2,r=.4+Math.random()*.4;spawn({m,life:.9,delay:Math.random()*.25,upd:(p,u)=>{p.m.position.set(at.x+Math.cos(a)*r,up?.2+u*2:2.2-u*2,at.z+Math.sin(a)*r);if(!up)p.m.rotation.z=PI;p.m.material.opacity=1-u}})}}
    });
    if(e.num){const at=headPos(e.num.s);numSprite(e.num.h?'+'+e.num.v:'-'+e.num.v,e.num.h?'#7aff9a':e.num.e>1?'#ffd23f':e.num.e<1?'#c8d0d8':'#ffffff',at,e.num.c);if(e.num.c)numSpriteLater('CRIT!','#ff5a4f',at,.15);if(e.num.c||e.num.e>1)shake=Math.max(shake,e.num.c?.28:.16)}
    if(e.atk==null&&!e.intro&&cam.mode==='close'&&cam.hold<=0)wideCam();

  function numSpriteLater(t,c,at,d){spawn({life:.01,delay:d,upd:()=>{}, done:()=>numSprite(t,c,V(at.x,at.y+.45,at.z),true)})}

  /* ---------- loop ---------- */
  function tick(){
    if(!renderer||!renderer.domElement.isConnected){running=false;return}

  }
  let mode='battle',showMons=[],showT0=0,showKey='',lastFlex=0;
  function animParts(m,t,ph){const P=m.P;P.flames.forEach((f,k)=>f.scale.set(1,1+Math.sin(t*14+k*2)*.18,1));P.wings.forEach(w=>flap(w,t,ph));if(P.halo)P.halo.rotation.z=t*.8}
  function clearShow(){showMons.forEach(s=>scene.remove(s.m.root));showMons=[];showKey=''}
  function showcase(el,list){
    if(!renderer)init();
    if(el.firstChild!==renderer.domElement)el.insertBefore(renderer.domElement,el.firstChild);
    const key=list.join();
    if(mode!=='title'||showKey!==key){
      for(let i=0;i<4;i++)clearSlot(i);clearShow();setVenue('colosseum');
      const n=list.length,R=4.6;
      list.forEach((sp,k)=>{const m=buildMon(sp);const a=(k-(n-1)/2)*.4;const x=Math.sin(a)*R,z=-Math.cos(a)*R+3.1;m.root.position.set(x,0,z);m.root.rotation.y=Math.atan2(-x,11-z);m.root.visible=false;scene.add(m.root);showMons.push({m,sp,ph:Math.random()*6,delay:.5+k*.45,born:false,flex:0})});
      showKey=key;showT0=now();lastFlex=showT0+2;mode='title';

  }
  function stepTitle(t){
    showMons.forEach(s=>{const r=s.m.root,b=s.m.body,P=s.m.P;const age=t-showT0-s.delay;

      if(!s.born){s.born=true;const at=r.position;burst(V(at.x,P.h*.5,at.z),'#fff2b0','spark',20,0,true);ringAt(V(at.x,.35,at.z),'#ffe680',0);cheer=Math.min(1,cheer+.45);if(rarityOf(s.sp)==='L'){shake=Math.max(shake,.12);burst(V(at.x,P.h*.6,at.z),'#ffd23f','star',26,.1,true)}}
      let sc=1;if(age<.7){const u=age/.7;sc=u<.7?u/.7*1.12:1.12-(u-.7)/.3*.12}
      const bob=Math.sin(t*2.2+s.ph)*(P.float?.06:.025);b.position.set(0,bob+(P.float?.18:0),0);b.scale.setScalar(Math.max(.01,sc));b.rotation.set(0,Math.sin(t*.6+s.ph)*.15,0);
      animParts(s.m,t,s.ph);
      if(s.flex){const u=(t-s.flex)/.9;if(u>=1){s.flex=0;setJaw(P,0)}else{const k2=Math.sin(u*PI);b.position.y+=k2*.32;b.rotation.x=-k2*.12;setJaw(P,k2)}}
    });
    if(t-lastFlex>2.4&&showMons.length){const born=showMons.filter(s=>s.born&&!s.flex);if(born.length){lastFlex=t;const s=born[Math.floor(Math.random()*born.length)];s.flex=t;const fx0=TYPEFX[SPECIES[s.sp].t[0]]||TYPEFX.nor;const at=s.m.root.position,h=s.m.P.h;
      burst(V(at.x,h*.7,at.z),fx0[0],fx0[1]==='bolt'?'spark':fx0[1],16,.18,fx0[0]!=='#3a2a4a');ringAt(V(at.x,h*.6,at.z),fx0[0],.12);cheer=Math.min(1,cheer+.35)}}
  }
  function titleCam(t){const el=renderer.domElement;const a=el.clientWidth/Math.max(1,el.clientHeight);const d=a<1?16.5:a<1.4?12.5:10.8;const ang=Math.sin(t*.11)*.42;
    camera.position.set(Math.sin(ang)*d+(Math.random()-.5)*shake,(a<1?3.6:2.7)+(Math.random()-.5)*shake,Math.cos(ang)*d+1.2);camera.lookAt(0,a<1?1.0:1.25,-.6);shake=Math.max(0,shake-.02)}
  function frame(){
    const dt=Math.min(.05,clock.getDelta()),t=clock.getElapsedTime();
    resize();
    if(venue){venue.anim.forEach(f=>f(t,dt));if(venue.crowd)updateCrowd(venue.crowd,t,cheer);if(venue.weather)stepWeather(venue.weather,dt,t)}
    cheer=Math.max(0,cheer-dt*.45);
    if(mode==='title'){stepTitle(t);stepFx(dt);titleCam(t);renderer.render(scene,camera);return}
    for(const s of slots){if(!s)continue;const r=s.m.root,b=s.m.body,P=s.m.P;

      let open=0;

      if(P.halo)P.halo.rotation.z=t*.8;
      const A=s.anim;
      if(A){const u=Math.min(1,(t-A.t0)/A.dur);const fwd=s.i<2?-1:1;

        else if(A.k==='cast'){const k=Math.sin(u*PI);b.position.y+=k*.25;b.rotation.y=Math.sin(u*PI*2)*.3;open=k*.7}
        else if(A.k==='hit'){r.position.z-=fwd*Math.sin(u*PI)*.3;r.visible=u>.9||Math.floor(u*16)%2===0;b.rotation.z=Math.sin(u*PI*4)*.12}
        else if(A.k==='faint'){b.rotation.z=u*1.1*(s.i%2?-1:1);b.position.y-=u*.5;const sc=1-u*.4;b.scale.set(sc,sc,sc);if(u>=1)r.visible=false}
        else if(A.k==='in'){const k=u<.7?u/.7*1.12:1.12-(u-.7)/.3*.12;b.scale.setScalar(Math.max(.01,k));if(u<.5){const at=SLOTPOS[s.i];if(!A.beam){A.beam=new T.Mesh(GEO.cyl,pmat('#fff6c0',true));A.beam.scale.set(.6,6,.6);A.beam.position.set(at.x,3,at.z);scene.add(A.beam)}A.beam.material.opacity=1-u*2}else if(A.beam){scene.remove(A.beam);A.beam=null}}
        if(u>=1){if(A.beam)scene.remove(A.beam);s.anim=null}}

    else{const k=1-Math.pow(cam.mode==='close'?.02:.12,dt);cam.pos.lerp(cam.tpos,k);cam.look.lerp(cam.tlook,k)}

    if(venue&&venue.lights){venue.lights.hemi.intensity=venue.lights.hemi._b==null?(venue.lights.hemi._b=venue.lights.hemi.intensity):venue.lights.hemi._b+flash*1.4}flash=Math.max(0,flash-dt*4);

      const m=buildMon(sp);m.root.rotation.y=-.45;pr.s.add(m.root);const h=m.P.h,w=m.P.w;const dist=Math.max(h,w*.95)*2.15+.6;pr.c.position.set(0,h*.6,dist);pr.c.lookAt(0,h*.48,0);

})();

function doAction(i,a){

function residual(){

    if(m.st==='brn'||m.st==='psn'){const d=Math.max(1,Math.floor(m.mhp/(m.st==='brn'?16:8)));m.hp=Math.max(0,m.hp-d);ev(`${nm(i)} is hurt by its ${m.st==='brn'?'burn':'poison'}!`,{fx:[{s:i,k:'hit'}],num:{s:i,v:d}});if(m.hp<=0)faint(i)}}

function resolveTurn(){

    acts.push({i,a,pri,spd:live?stat(i,'spe'):0,tie:rnd(),u:live?mon(i).uid:null})}

function venueKey(){const C=G&&G.cup;if(!C)return 'colosseum';return C.ff?['storm','quarry','graveyard','icepalace','throne'][Math.min(4,C.fight)]:['colosseum','pier','crater','crown'][C.c]}

  const opps=[0,1,2].map(()=>{let a,b;do{a=pick(TITLES)+' '+pick(FIRST);b=pick(TITLES)+' '+pick(FIRST)}while(a===b);return{n:[a,b]}});

}

  G.cup={c:4,ff:true,fight:0,res:[],opps:FF.map(f=>({n:f.n.slice(),title:f.t,boss:true}))};
  G.pl.forEach(P=>{P.bag.maxp+=5;P.bag.revive+=1});

  ev('Six Chimpokomon each. The Freaky Five are waiting: five leader pairs, back to back, no healing and no upgrades. Each trainer gets 5 Max Potions and a Revive.',{d:2600});
}
function newRun(){
  G.pl=[mkPlayer(),mkPlayer()];G.pend=[];G.offer=null;G.cup=null;G.b=null;G.run++;G.phase='starter';G.ready=[false,false];
  ev(`Run ${G.run} begins. Pick your starters!`);
}
function movePool(m,cap){
  const known=new Set(m.moves.map(x=>x.id));
  const pool=famMoves(m.sp).filter(id=>!known.has(id)&&MOVES[id].p<=cap);
  if(rnd()<0.25){const all=Object.keys(MOVES).filter(id=>id!=='struggle'&&MOVES[id].p>0&&MOVES[id].p<=cap&&!known.has(id)&&!pool.includes(id));if(all.length)pool.push(pick(all))}

const UPW=[[60,30,9,1],[45,33,18,4],[35,33,24,8],[25,32,30,13]];

    if(!pool.length||rnd()<0.25){const g=Object.keys(MOVES).filter(id=>id!=='struggle'&&MOVES[id].p>0&&MRAR[id]===t&&!known.has(id)&&!pool.includes(id));if(g.length)pool=pool.concat([pick(g)])}
    if(pool.length)return pick(pool);ti--}
  return null}
function mkOffers(p){
  const P=G.pl[p],w=UPW[Math.min(G.cup.c,3)],out=[],keys=new Set();let guard=0;
  while(out.length<3&&guard++<80){const tier=TIERS[rollIdx(w)],r=rnd();let o=null;
    if(r<0.4){const m=pick(P.party);const mv=movePick(m,tier);if(mv)o={t:'move',uid:m.uid,mv,r:MRAR[mv]}}
    else if(r<0.75){const m=pick(P.party);o=tier==='L'?{t:'stat',uid:m.uid,stat:'all',pct:10,r:'L'}:{t:'stat',uid:m.uid,stat:pick(STATS6),pct:STATP[tier],r:tier}}
    else{const [it,n]=pick(ITEMR[tier]);o={t:'item',item:it,n,r:tier}}
    if(!o)continue;const key=JSON.stringify(o);if(keys.has(key))continue;keys.add(key);out.push(o)}
  return out;
}
function genRewards(){G.offer=[0,1].map(p=>({kind:'reward',opts:mkOffers(p),pick:null}))}
const RW=[[60,25,15,0],[40,30,25,5],[25,30,33,12],[15,25,40,20]];
function genSpoils(){
  const owned=new Set(G.pl.flatMap(P=>P.party.map(m=>baseOf(m.sp))));const offered=new Set();const w=RW[Math.min(G.cup.c,3)],tot=w.reduce((x,y)=>x+y,0);
  const pool=t=>Object.keys(SPECIES).filter(sp=>!PRE[sp]&&rarityOf(sp)===t&&!owned.has(sp)&&!offered.has(sp));
  G.offer=[0,1].map(()=>{const mons=[];for(let k=0;k<3;k++){let r=rnd()*tot,ti=0;while(r>=w[ti]){r-=w[ti];ti++}
    const order=[ti,...[0,1,2,3].filter(x=>x!==ti&&w[x]>0).sort((x,y)=>w[y]-w[x])];let sp=null;
    for(const t of order){const P=pool(TIERS[t]);if(P.length){sp=pick(P);break}}
    if(sp){mons.push(sp);offered.add(sp)}}

function canEvolveAny(p){return G.pl[p].party.some(m=>SPECIES[m.sp].evo)}
function rewardText(p,o){const m=o.uid!=null?G.pl[p].party.find(x=>x.uid===o.uid):null;

function checkRewardDone(){

function pendFor(p){return G.pend.find(x=>x.p===p)}
function validAct(p,a){

    if(a.k==='item'&&(a.item==='revive'||a.item==='phoenix')&&isInt(a.i,0,P.party.length-1)&&P.party[a.i].hp<=0&&itemOk(P,a.item,a.i))return{k:'item',item:a.item,i:a.i};
    return null;
  }
  switch(a.k){
    case 'move':{const u=mon(p);if(!isInt(a.m,-1,3))return null;
      if(a.m===-1){if(u.moves.some(x=>x.pp>0))return null;return{k:'move',m:-1,t:foesOf(p).find(alive)}}
      const ms=u.moves[a.m];if(!ms||ms.pp<=0)return null;const mv=MOVES[ms.id];
      let t=null;if(mv.tg==='one'){t=(a.t===2||a.t===3)&&alive(a.t)?a.t:foesOf(p).find(alive);if(t==null)return null}
      return{k:'move',m:a.m,t}}
    case 'switch':{if(!isInt(a.i,0,P.party.length-1)||a.i===b.act[p]||P.party[a.i].hp<=0)return null;return{k:'switch',i:a.i}}
    case 'item':{if(!itemOk(P,a.item,a.i))return null;return{k:'item',item:a.item,i:a.i}}

const PCMDS=new Set(['starters','ready','lead','act','undo','replace','learn','reward','draft','evolve']);
function apply(c){

    case 'starters':{

      if(!c.ids.every(id=>STARTERS.includes(id)))return false;

function render(){
  const app=document.getElementById('app');if(!app)return;
  if(G&&G.phase!==ui.lastPhase){if(G.phase==='starter')ui.pick=[[],[]];ui.menu=[{v:'root'},{v:'root'}];ui.lastPhase=G.phase}
  ui.nextHp={};ui.stageData=null;
  let h=header();
  if(!G||G.phase==='lobby')h+=ui.mode?waiting():lobby();
  else if(ui.cur&&ui.cur.snap&&!ui.cur.evo&&G.b)h+=battleView(true);
  else switch(G.phase){
    case 'starter':h+=starterView();break;
    case 'hub':h+=hubView();break;
    case 'reward':h+=rewardView();break;
    case 'spoils':h+=spoilsView();break;
    case 'gameover':case 'victory':h+=endView();break;
    case 'battle':h+=battleView(false);break;
  }
  h+=overlays();
  app.innerHTML=h;
  Object.assign(ui.prevHp,ui.nextHp);
  const ts=document.getElementById('title-slot');if(ts&&V3.ok){try{V3.showcase(ts,titleMons())}catch(err){console.error('3D disabled:',err);V3.ok=false;render();return}}
  const lb=document.getElementById('blog-b');if(lb)lb.scrollTop=lb.scrollHeight;
  const slot=document.getElementById('stage-slot');if(slot&&ui.stageData){try{V3.mount(slot,ui.stageData,ui.cur,venueKey())}catch(err){console.error('3D disabled:',err);V3.ok=false;render()}}
}
function header(){
  let meta='';
  if(G&&G.cup&&G.phase!=='starter'){const C=G.cup;meta+=`<span class="pill">${esc(cupLabel())} · ${C.ff?'Leader '+Math.min(5,C.fight+1)+'/5':ROUNDS[Math.min(3,C.fight)]}</span>`}
  if(G&&G.phase!=='lobby')meta+=`<span class="pill">Run ${G.run}</span>`;
  if(ui.mode==='local')meta+=`<span class="pill">Same device</span>`;
  if(ui.mode==='host'||ui.mode==='guest'){meta+=`<span class="pill">Room ${esc(NET.code)}</span>`;
    const on=ui.mode==='host'?NET.partner:(Date.now()-NET.hostSeen<9000);meta+=`<span class="pill ${on?'on':'off'}">${on?'Partner connected':'Partner away'}</span>`}
  if(ui.mode)meta+=`<button class="btn ghost" data-do="leave" style="padding:4px 10px;font-size:13px">Leave</button>`;
  return `<header class="top"><div class="brand">Chimpokomon</div><div class="meta">${meta}</div></header>`;
}
function titleMons(){
  if(ui.titleMons)return ui.titleMons;
  const fin=Object.keys(SPECIES).filter(s=>!SPECIES[s].evo);const legs=fin.filter(s=>rarityOf(s)==='L'),rest=fin.filter(s=>rarityOf(s)!=='L');
  const rp=a=>a[Math.floor(Math.random()*a.length)];const out=[];while(out.length<5){const s=rp(rest);if(!out.includes(s))out.push(s)}
  out.splice(2,0,rp(legs));return ui.titleMons=out;
}

function speedInfo(i){

function dmgRange(i,t,mv,spread){

function pump(){
  if(ui.playing||!G)return;
  const q=G.evq.filter(e=>e.id>ui.played);
  if(!q.length){if(ui.cur){ui.cur=null;ui.fast=false;render()}return}
  const e=q[0];ui.playing=true;ui.cur=e;render();try{V3.onEvent(e)}catch(err){console.error('3D disabled:',err);V3.ok=false;render()}
  const dur=ui.fast?120:q.length>24?260:(e.d||Math.min(1700,650+e.t.length*14));
  setTimeout(()=>{ui.played=e.id;ui.playing=false;pump()},dur);
}

/* ================= ONLINE: PeerJS room adapter ================= */
function mkBus(){const H={};return{on(t,f){(H[t]=H[t]||[]).push(f);return()=>{H[t]=(H[t]||[]).filter(x=>x!==f)}},fire(t,m){(H[t]||[]).slice().forEach(f=>{try{f(m)}catch(e){console.error(e)}})}}}
function peerRoom(){
  if(typeof Peer==='undefined')return null;
  const PFX='chimpokomon-v1-';
  return{join(name,role){return role==='host'?hostRoom(PFX+name):guestRoom(PFX+name)}};
}
function hostRoom(id){return new Promise((res,rej)=>{let tries=0;
  const start=()=>{
    const peer=new Peer(id);let opened=false;const conns=new Set();const bus=mkBus();const pl=[];
    const peersArr=()=>[{peer:'host',isMe:true,presence:{role:'host'}},...[...conns].map(c=>({peer:c.peer,isMe:false,presence:{role:'guest'}}))];
    const notify=()=>{const ps=peersArr();pl.forEach(f=>{try{f({peers:ps})}catch(e){}})};
    peer.on('open',()=>{opened=true;res({
      emit:async(t,d)=>{for(const c of conns)if(c.open)c.send({t,d})},
      on:(t,f)=>bus.on(t,f),presence:async()=>{},peers:peersArr,
      onPeers:f=>{pl.push(f);setTimeout(()=>f({peers:peersArr()}),0);return()=>{}},
      leave:async()=>{try{peer.destroy()}catch(e){}}})});
    peer.on('connection',c=>{
      c.on('open',()=>{conns.add(c);notify()});
      c.on('data',m=>{if(m&&typeof m.t==='string')bus.fire(m.t,{topic:m.t,data:m.d,peer:c.peer,isMe:false})});
      c.on('close',()=>{conns.delete(c);notify()});c.on('error',()=>{conns.delete(c);notify()})});
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{if(!opened){try{peer.destroy()}catch(x){}if(e&&e.type==='unavailable-id'&&tries++<5)setTimeout(start,2500);else rej(e)}});
  };start()})}
function guestRoom(id){return new Promise((res,rej)=>{
  const peer=new Peer();const bus=mkBus();let conn=null,resolved=false,closed=false;
  const api={emit:async(t,d)=>{if(conn&&conn.open)conn.send({t,d})},on:(t,f)=>bus.on(t,f),presence:async()=>{},peers:()=>[],onPeers:()=>()=>{},
    leave:async()=>{closed=true;try{peer.destroy()}catch(e){}}};
  const connect=()=>{if(closed)return;const c=peer.connect(id,{reliable:true});
    c.on('open',()=>{conn=c;if(!resolved){resolved=true;res(api)}else bus.fire('_reconnect',{})});
    c.on('data',m=>{if(m&&typeof m.t==='string')bus.fire(m.t,{topic:m.t,data:m.d,peer:'host',isMe:false})});
    c.on('close',()=>{if(conn===c)conn=null;if(!closed)setTimeout(connect,3000)})};
  peer.on('open',connect);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e&&e.type==='peer-unavailable'){if(!resolved){resolved=true;closed=true;try{peer.destroy()}catch(x){}rej(new Error('notfound'))}else if(!closed)setTimeout(connect,3000)}else if(!resolved){resolved=true;rej(e)}});
  setTimeout(()=>{if(!resolved){resolved=true;closed=true;try{peer.destroy()}catch(x){}rej(new Error('timeout'))}},15000);
})}

/* ================= COMMANDS / NET ================= */
function save(){if(ui.mode!=='local'&&ui.mode!=='host')return;try{localStorage.setItem('chimpokomon.save',JSON.stringify({v:2,mode:ui.mode,code:NET.code,gid:NET.gid,seed:SEED,name:ui.name,log:LOG}))}catch(e){}}
function onChange(){if(ui.sum){const P=G.pl[ui.sum.p];if(!P||!P.party[ui.sum.i])ui.sum=null}render();pump()}
function hostCmd(c){if(!apply(c)){render();return false}LOG.push(c);save();if(ui.mode==='host'&&NET.r)NET.r.emit('cmd',{gid:NET.gid,seq:LOG.length-1,cmd:c}).catch(()=>{});onChange();return true}
function send(c){
  if(c.p!=null){ui.menu[c.p]={v:'root'};if(c.k==='act'||c.k==='replace')ui.dockP=null}
  if(ui.mode==='guest'){if(!NET.r)return;NET.r.emit('act',{cmd:c}).catch(()=>{ui.err='Could not reach the host.';render()});render();return}
  hostCmd(c);
}
function sanitize(c,p){
  if(!c||typeof c!=='object'||typeof c.k!=='string'||c.k==='setup')return null;
  const o={k:c.k};if(PCMDS.has(c.k))o.p=p;
  if(Array.isArray(c.ids))o.ids=c.ids.slice(0,2).map(String);
  for(const k of ['i','slot','uid'])if(Number.isInteger(c[k]))o[k]=c[k];
  if(typeof c.item==='string')o.item=c.item.slice(0,10);
  if(c.a&&typeof c.a==='object'){const a=c.a;o.a={k:String(a.k||'')};for(const k of ['m','t','i'])if(Number.isInteger(a[k]))o.a[k]=a[k];if(typeof a.item==='string')o.a.item=a.item.slice(0,10)}
  return o;
}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=new Uint32Array(6);crypto.getRandomValues(r);for(const x of r)s+=A[x%A.length];return s}
function genSeed(){const r=new Uint32Array(1);crypto.getRandomValues(r);return r[0]|0}
function replay(log){for(const c of log){if(apply(c))LOG.push(c)}ui.played=G.evId;ui.cur=null}
function chunks(from){const out=[];let cur=[],size=0;for(let k=from;k<LOG.length;k++){const s=JSON.stringify(LOG[k]).length+1;if(size+s>3000&&cur.length){out.push({from:k-cur.length,cmds:cur});cur=[];size=0}cur.push(LOG[k]);size+=s}out.push({from:LOG.length-cur.length,cmds:cur});return out}
async function sendSync(from){if(!NET.r)return;from=isInt(from,0,LOG.length)?from:0;for(const ch of chunks(from)){try{await NET.r.emit('sync',{gid:NET.gid,seed:SEED,from:ch.from,cmds:ch.cmds,total:LOG.length})}catch(e){return}}}
async function hostOnline(resume){
  ui.err='';const room=NET.room;if(!room){ui.err='Online rooms are not available here.';render();return}
  const code=resume?resume.code:genCode();let r;
  try{r=await room.join(code.toLowerCase(),'host')}catch(e){ui.err=e&&e.type==='unavailable-id'?'That room code is still in use. Wait a few seconds and try again.':'Could not reach the matchmaking server. Check your connection and try again.';render();return}
  NET.r=r;NET.code=code;ui.mode='host';ui.me=0;LOG=[];
  if(resume){SEED=resume.seed;NET.gid=resume.gid||genCode();newGame(SEED);replay(resume.log)}else{SEED=genSeed();NET.gid=genCode()+genCode();newGame(SEED)}
  r.presence({role:'host'}).catch(()=>{});
  r.on('hello',msg=>{if(msg.isMe)return;
    NET.guestPeer=msg.peer;const gname=cleanName(msg.data&&msg.data.name,'Trainer 2');
    if(G.phase==='lobby')hostCmd({k:'setup',names:[ui.name||'Trainer 1',gname]});else sendSync(0)});
  r.on('act',msg=>{if(msg.isMe||msg.peer!==NET.guestPeer)return;const c=sanitize(msg.data&&msg.data.cmd,1);if(c)hostCmd(c)});
  r.on('resync',msg=>{if(msg.isMe||msg.peer!==NET.guestPeer)return;sendSync(msg.data&&msg.data.from)});
  r.onPeers(ch=>{const was=NET.partner;NET.partner=ch.peers.some(x=>!x.isMe&&x.presence&&x.presence.role==='guest');if(was!==NET.partner)render()});
  clearInterval(NET.beat);NET.beat=setInterval(()=>{r.emit('beat',{gid:NET.gid,seq:LOG.length}).catch(()=>{})},3000);
  save();onChange();
}
function requestResync(from){const now=Date.now();if(now-NET.lastResync<1500||!NET.r)return;NET.lastResync=now;NET.r.emit('resync',{from}).catch(()=>{})}
function guestApply(c){if(apply(c)){LOG.push(c);return true}NET.gid='';requestResync(0);return false}
async function joinOnline(code){
  ui.err='';const room=NET.room;if(!room){ui.err='Online rooms are not available here.';render();return}
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6){ui.err='Room codes are 6 letters and numbers.';render();return}
  let r;try{r=await room.join(code.toLowerCase(),'guest')}catch(e){ui.err=e&&e.message==='notfound'?'No room with that code. Check it, and make sure the host has the game open.':'Could not connect to that room. Check your connection and try again.';ui.mode=null;render();return}
  NET.r=r;NET.code=code;ui.mode='guest';ui.me=1;G=null;LOG=[];NET.gid='';
  r.presence({role:'guest'}).catch(()=>{});
  r.on('sync',msg=>{if(msg.isMe)return;const d=msg.data;if(!d||!Array.isArray(d.cmds)||!Number.isInteger(d.from))return;NET.hostSeen=Date.now();
    let fresh=false;
    if(d.gid!==NET.gid){if(d.from!==0){requestResync(0);return}NET.gid=d.gid;SEED=d.seed|0;newGame(SEED);LOG=[];fresh=true}
    if(d.from>LOG.length){requestResync(LOG.length);return}
    const start=LOG.length-d.from;for(let k=start;k<d.cmds.length;k++){if(!guestApply(d.cmds[k]))return}
    if(fresh||d.cmds.length>6){ui.played=G.evId;ui.cur=null}
    clearInterval(NET.hello);onChange()});
  r.on('cmd',msg=>{if(msg.isMe)return;const d=msg.data;if(!d)return;NET.hostSeen=Date.now();if(d.gid!==NET.gid||!G){requestResync(0);return}
    if(d.seq===LOG.length){if(guestApply(d.cmd))onChange()}else if(d.seq>LOG.length)requestResync(LOG.length)});
  r.on('beat',msg=>{if(msg.isMe)return;const d=msg.data||{};const was=Date.now()-NET.hostSeen<9000;NET.hostSeen=Date.now();
    if(d.gid!==NET.gid)requestResync(0);else if(d.seq>LOG.length)requestResync(LOG.length);if(!was)render()});
  const hello=()=>r.emit('hello',{name:ui.name||'Trainer 2'}).catch(()=>{});
  r.on('_reconnect',()=>{NET.gid&&requestResync(LOG.length);hello()});
  hello();clearInterval(NET.hello);NET.hello=setInterval(()=>{if(!NET.gid)hello();else clearInterval(NET.hello)},2000);
  try{localStorage.setItem('chimpokomon.guest',JSON.stringify({code,name:ui.name}))}catch(e){}
  render();
  setInterval(()=>{if(ui.mode==='guest')render()},10000);
}
function startLocal(resume){
  ui.mode='local';ui.me=null;LOG=[];NET.code='';
  if(resume){SEED=resume.seed;newGame(SEED);replay(resume.log)}
  else{SEED=genSeed();newGame(SEED);hostCmd({k:'setup',names:[ui.name||'Trainer 1',ui.name2||'Trainer 2']})}
  save();onChange();
}
function leave(){
  if(NET.r){NET.r.leave().catch(()=>{});NET.r=null}clearInterval(NET.beat);clearInterval(NET.hello);
  ui.mode=null;ui.me=null;G=null;LOG=[];ui.cur=null;ui.playing=false;ui.sum=null;ui.pick=[[],[]];ui.menu=[{v:'root'},{v:'root'}];ui.lastPhase=null;render();
}
function onClick(e){
  const el=e.target.closest('[data-do]');if(!el||el.disabled)return;
  if(el.dataset.do==='sumclose'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  const d=el.dataset,p=d.p!=null?+d.p:null;
  switch(d.do){
    case 'host':ui.name=cleanName(document.getElementById('nm').value,'Trainer 1');hostOnline(null);break;
    case 'join':ui.name=cleanName(document.getElementById('nm').value,'Trainer 2');ui.joinCode=document.getElementById('jc').value;joinOnline(ui.joinCode);break;
    case 'local':ui.name=cleanName(document.getElementById('nm1').value,'Trainer 1');ui.name2=cleanName(document.getElementById('nm2').value,'Trainer 2');startLocal(null);break;
    case 'resume':{let s=null;try{s=JSON.parse(localStorage.getItem('chimpokomon.save'))}catch(err){}if(!s||s.v!==2)return;ui.name=s.name||ui.name;if(s.mode==='host')hostOnline(s);else startLocal(s);break}
    case 'forget':try{localStorage.removeItem('chimpokomon.save')}catch(err){}render();break;
    case 'leave':leave();break;
    case 'copy':{const t=NET.code;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{el.textContent='Copied'},()=>{el.textContent=t});else el.textContent=t;break}
    case 'pick':{const s=d.s,a=ui.pick[p];const k=a.indexOf(s);if(k>=0)a.splice(k,1);else if(a.length<2)a.push(s);else{a.shift();a.push(s)}render();break}
    case 'confirm':send({k:'starters',p,ids:ui.pick[p].slice()});break;
    case 'ready':send({k:'ready',p});break;
    case 'sum':ui.sum={p,i:+d.i};render();break;
    case 'sumclose':ui.sum=null;render();break;
    case 'lead':ui.sum=null;send({k:'lead',p,i:+d.i});break;
    case 'reward':send({k:'reward',p,i:+d.i});break;
    case 'draft':send({k:'draft',p,i:+d.i});break;
    case 'evolve':send({k:'evolve',p,uid:+d.uid});break;
    case 'menu':ui.menu[p]={v:d.v};render();break;
    case 'move':{const m=+d.m;if(m<0){send({k:'act',p,a:{k:'move',m:-1}});break}
      const mv=MOVES[mon(p).moves[m].id];const foes=[2,3].filter(alive);
      if(mv.tg==='one'&&foes.length>1){ui.menu[p]={v:'target',m};render()}else send({k:'act',p,a:{k:'move',m,t:foes[0]}});break}
    case 'target':send({k:'act',p,a:{k:'move',m:+d.m,t:+d.t}});break;
    case 'switch':send({k:'act',p,a:{k:'switch',i:+d.i}});break;
    case 'bagitem':{const it=d.item;if(it==='tonic'){send({k:'act',p,a:{k:'item',item:'tonic',i:G.b.act[p]}});break}if(it==='phoenix'&&alive(p)){send({k:'act',p,a:{k:'item',item:'phoenix',i:G.b.act[p]}});break}ui.menu[p]={v:'bagtarget',item:it};render();break}
    case 'item':send({k:'act',p,a:{k:'item',item:d.item,i:+d.i}});break;
    case 'pass':send({k:'act',p,a:{k:'pass'}});break;
    case 'undo':send({k:'undo',p});break;
    case 'replace':send({k:'replace',p,i:+d.i});break;
    case 'learn':send({k:'learn',p,slot:+d.slot});break;
    case 'skip':ui.fast=true;break;
    case 'focusfoe':ui.focusFoe=+d.t;render();break;
    case 'togglelog':ui.logOpen=!ui.logOpen;render();break;
    case 'dockp':ui.dockP=p;render();break;
  }
}
function onInput(e){const id=e.target.id;if(id==='nm'||id==='nm1')ui.name=e.target.value;else if(id==='nm2')ui.name2=e.target.value;else if(id==='jc')ui.joinCode=e.target.value}
function boot(){
  try{const g=JSON.parse(localStorage.getItem('chimpokomon.guest')||'null');if(g){ui.joinCode=g.code||'';ui.name=g.name||''}}catch(e){}
  document.addEventListener('click',onClick);document.addEventListener('input',onInput);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sum){ui.sum=null;render()}});
  render();
  NET.room=peerRoom();ui.roomState=NET.room?'ok':'none';render();
}
if(typeof document!=='undefined'&&document.getElementById('app'))boot();
</script>
